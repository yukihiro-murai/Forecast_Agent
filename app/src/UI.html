<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<base target="_top">
<title>Trends2Targets</title>
<style>
/* ---- トークン（色・角丸・高さ・間隔は 4px の倍数） ---- */
:root{
  --bg:#F4F7FB; --card:#FFFFFF; --surface:#F8FAFC;
  --primary:#00A0E9; --primary-dark:#0084C5; --primary-soft:#E5F4FD;
  --navy:#0F3557; --navy-2:#1B4A73; --text:#24303E; --muted:#5A6B7E; --line:#DCE4EC; --line-soft:#EEF2F6;
  --ok-bg:#E7F6EE; --ok-fg:#17734A; --warn-bg:#FFF6E8; --warn-fg:#A65C00; --error:#C0392B; --error-bg:#FDEDEC;
  --radius:12px; --radius-s:8px;
  --h-btn:40px; --h-btn-sm:32px; --h-input:40px; --h-cell:36px;
  --w-btn:160px; --w-btn-sm:104px; --w-action:248px; --w-tab:128px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --shadow:0 1px 2px rgba(15,53,87,.05), 0 4px 14px rgba(15,53,87,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--primary-dark)}

/* ---- 枠組み ---- */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--navy);display:flex;align-items:center;padding:0 var(--s6);color:#fff;z-index:60}
.topbar .ttl{font-size:16px;font-weight:700;letter-spacing:.02em}
.topbar .ttl-ja{font-size:13px;font-weight:600;color:#B8CFE3;margin-left:var(--s3);letter-spacing:0}
.topbar .spacer{flex:1}
.topbar .meta{font-size:12.5px;color:#B8CFE3;margin-left:var(--s4)}
.topbar .meta b{color:#fff}
.layout{display:flex;padding-top:56px;min-height:100vh}
.sidenav{width:208px;flex:0 0 208px;padding:var(--s4) var(--s3);border-right:1px solid var(--line);background:#fff}
.navbtn{display:flex;width:100%;height:40px;align-items:center;padding:0 var(--s4);border-radius:var(--radius-s);font-size:14px;font-weight:700;color:var(--muted);margin-bottom:var(--s1);text-align:left}
.navbtn.on{background:var(--navy);color:#fff}
.navbtn:hover:not(.on){background:var(--primary-soft);color:var(--navy)}
.main{flex:1;min-width:0;padding:var(--s6) var(--s8) 64px;max-width:1184px}

/* ---- 見出し ---- */
.page-head{display:flex;align-items:center;gap:var(--s4);margin-bottom:var(--s4);min-height:40px}
.page-head h1{flex:1;margin:0}
h1{font-size:22px;line-height:1.35;color:var(--navy);margin-bottom:var(--s4)}
.card h2{font-size:15px;color:var(--navy);margin-bottom:var(--s3)}
.card-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.card-head h2{flex:1;margin:0}
.note{font-size:12.5px;color:var(--muted)}
.mt0{margin-top:0!important}.mt4{margin-top:var(--s1)}.mt8{margin-top:var(--s2)}.mt12{margin-top:var(--s3)}.mt16{margin-top:var(--s4)}
.err-text{color:var(--error)}.warn-text{color:var(--warn-fg)}

/* ---- カード ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--s5) var(--s6);margin-bottom:var(--s4)}
.card.soft{background:var(--primary-soft);border-color:#CBE7F8;box-shadow:none}
.card.alert{background:var(--error-bg);border-color:#F2C4BF;box-shadow:none}
.card.caution{background:var(--warn-bg);border-color:#F3D9B1;box-shadow:none}
.card-foot{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line-soft)}
.card-foot .note{flex:1;min-width:240px}

/* ---- 案内役 ---- */
.guide{display:flex;gap:var(--s4);align-items:flex-start}
.charbox{width:64px;height:64px;flex:0 0 64px}
.charbox svg{width:100%;height:100%;display:block}
.bubble{position:relative;background:var(--primary-soft);border-radius:var(--radius);padding:var(--s3) var(--s4);flex:1;font-size:14px;color:var(--navy)}
.bubble .chip{background:#fff}
.bubble::before{content:"";position:absolute;left:-8px;top:20px;border:8px solid transparent;border-right-color:var(--primary-soft);border-left:none}

/* ---- ボタン（高さと最小幅をそろえる） ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:var(--h-btn);min-width:var(--w-btn);padding:0 var(--s5);border-radius:var(--radius-s);font-size:14px;font-weight:700;background:var(--navy);color:#fff;white-space:nowrap;text-decoration:none;transition:background .15s}
.btn:hover:not(:disabled){background:var(--navy-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn-ghost:hover:not(:disabled){background:var(--surface);border-color:#C5D2DE}
.btn-sm{height:var(--h-btn-sm);min-width:var(--w-btn-sm);padding:0 var(--s3);font-size:13px}
.btn-icon{height:var(--h-btn-sm);width:var(--h-btn-sm);min-width:0;padding:0;font-size:16px;line-height:1}
.tbl .btn-icon{height:var(--h-cell);width:var(--h-cell)}
.btn-block{width:100%;min-width:0}

/* ---- タブ（同じ幅の切り替え） ---- */
.tabs{display:flex;flex-wrap:wrap;gap:var(--s1);padding:var(--s1);background:#E9EEF4;border-radius:10px;margin-bottom:var(--s4);width:max-content;max-width:100%}
.tab{height:36px;min-width:var(--w-tab);padding:0 var(--s4);border-radius:var(--radius-s);font-size:13.5px;font-weight:700;color:var(--muted)}
.tab.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(15,53,87,.12)}
.tab:hover:not(.on){color:var(--navy)}
.tabs.sub{background:transparent;padding:0;gap:var(--s2)}
.tabs.sub .tab{height:var(--h-btn-sm);min-width:var(--w-btn-sm);border:1.5px solid var(--line);background:#fff}
.tabs.sub .tab.on{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:none}

/* ---- 入力（行は下端でそろえる） ---- */
.row{display:flex;gap:var(--s3);align-items:flex-end;flex-wrap:wrap;margin-top:var(--s3)}
.row.c{align-items:center}
.row.nowrap{flex-wrap:nowrap}
.field{display:flex;flex-direction:column;gap:var(--s1)}
.field label{font-size:12.5px;font-weight:700;color:var(--navy)}
.inp{height:var(--h-input);padding:0 var(--s3);border:1.5px solid var(--line);border-radius:var(--radius-s);width:240px;background:#fff}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,160,233,.15)}
.inp.sm{width:160px}.inp.md{width:320px}.inp.lg{width:480px}
.inp.cell{height:var(--h-cell);width:100%;padding:0 var(--s2)}
.inp.num,.num .inp{text-align:right;font-variant-numeric:tabular-nums}
input.inp[type=number]{-moz-appearance:textfield;appearance:textfield}
input.inp[type=number]::-webkit-inner-spin-button,input.inp[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
select.inp{padding-right:var(--s6)}

/* ---- 実行の一覧（ボタンの幅をそろえ、説明の頭をそろえる） ---- */
.actions{display:grid;grid-template-columns:var(--w-action) 1fr;gap:var(--s3) var(--s4);align-items:center}
.actions .btn{width:100%;min-width:0}
.actions .desc{font-size:13px;color:var(--text)}
.actions .desc .note{display:block}

/* ---- 数字のまとめ ---- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:var(--s3) var(--s4);box-shadow:var(--shadow)}
.kpi .k{font-size:12px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.3;margin-top:2px}
.kpi .u{font-size:12px;color:var(--muted);margin-left:2px;font-weight:600}
.kpi.main{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}

/* ---- 表 ---- */
.tblwrap{overflow-x:auto;margin:0 calc(-1 * var(--s2))}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.tbl th{background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:700;text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:var(--s2) var(--s3);height:44px;border-bottom:1px solid var(--line-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.tbl tbody tr:hover td{background:#FAFCFE}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.wrap{white-space:normal}
.tbl td.ctr,.tbl th.ctr{text-align:center}
.tbl tr.total td{font-weight:700;color:var(--navy);border-top:1.5px solid var(--line);background:var(--surface)}
.tbl td.empty{text-align:center;color:var(--muted);height:64px}
.tbl.edit td{padding:6px var(--s2)}

/* ---- 小さな印 ---- */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;margin:0 4px 2px 0;background:var(--primary-soft);color:var(--primary-dark);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg)}
.chip.off{background:#EDF1F5;color:var(--muted)}
.chip.ng{background:var(--error-bg);color:var(--error)}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}

/* ---- 通知・処理中 ---- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 22px 8px 12px;border-radius:10px;font-size:14px;font-weight:700;color:#fff;background:var(--navy);box-shadow:0 8px 30px rgba(0,0,0,.18);opacity:0;transition:opacity .3s;z-index:95;pointer-events:none}
.toast.on{opacity:1}
.toast.err{background:var(--error);padding:12px 22px}
.toast .tc{width:34px;height:34px;flex:0 0 34px;background:#fff;border-radius:50%;padding:2px}
.toast .tc svg{width:100%;height:100%;display:block}
.busy{position:fixed;right:24px;bottom:24px;width:232px;height:64px;display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);font-size:13px;font-weight:700;color:var(--navy);opacity:0;pointer-events:none;transition:opacity .2s;z-index:94}
.busy.on{opacity:1}
.busy .bc{width:48px;height:48px;flex:0 0 48px}
.busy .bc svg{width:100%;height:100%;display:block}
.busy small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.jobbar{display:flex;align-items:center;gap:var(--s3)}
.jobbar b{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--primary);flex:0 0 10px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.waitlist{list-style:none;display:grid;gap:var(--s2)}
.waitlist li{display:flex;gap:var(--s2);align-items:center;font-size:13px}
.ws{white-space:normal}
.pre{white-space:pre-wrap;word-break:break-word}
.row.foot{margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line-soft)}
.tbl.mt12{margin-top:var(--s3)}

</style>
</head>
<body>
<div class="topbar"><div class="ttl">Trends2Targets<span class="ttl-ja">売上予測と予算策定</span></div><div class="spacer"></div><div class="meta" id="hdrUser"></div><div class="meta" id="hdrVer"></div></div>
<div class="layout"><nav class="sidenav" id="nav"></nav><main class="main" id="main"></main></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="busy" id="busy" role="status" aria-live="polite"></div>
<script>
<?!= charsJs ?>
var B = <?!= bootJson ?>;
var S = { view: 'home', dir: null, settings: null, audit: null, auditQ: '', health: null, pending: 0, writing: false,
  mig: { url: '', dry: null, result: null, plans: null, parity: null }, fc: { plans: null, planId: '', data: null, view: null, tab: 'forecast', inputKind: 'product', draft: {}, inputDirty: {}, budget: {}, ins: {}, dec: {} } };

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(id){ return document.getElementById(id); }
var toastT = null;
/** 通知。エラーは消えないよう画面の上にも残す（閉じるまで） */
function toast(msg, err){
  var el = $('toast');
  el.className = 'toast on' + (err ? ' err' : '');
  el.innerHTML = (err ? '' : '<span class="tc">' + YOMI_POSE.done + '</span>') + '<span>' + esc(msg) + '</span>';
  clearTimeout(toastT); toastT = setTimeout(function(){ el.className = 'toast'; }, err ? 8000 : 3800);
  if (err) { S.lastError = { message: String(msg), at: new Date().toLocaleTimeString('ja-JP') }; render(); }
}
function errorBanner(){
  if (!S.lastError) return '';
  return '<div class="card alert" role="alert"><div class="card-head"><h2 class="err-text">エラー（' + esc(S.lastError.at) + '）</h2>'
    + '<button class="btn btn-ghost btn-sm" onclick="S.lastError=null;render()">閉じる</button></div>'
    + '<div style="white-space:pre-wrap;word-break:break-all">' + esc(S.lastError.message) + '</div>'
    + '<p class="note mt8">これまでのエラーは「操作の記録」でも見られます。</p></div>';
}
var busyT = null;
/** 右下の表示。裏の処理を待っている間はその進み、ほかは通信中（0.6 秒を超えたら）を出す */
function busy(delta){
  var el = $('busy');
  S.pending = Math.max(0, S.pending + delta);
  clearTimeout(busyT);
  if (S.job) {
    var sec = Math.round((Date.now() - S.job.started) / 1000);
    el.innerHTML = '<span class="bc">' + YOMI_POSE.observe + '</span><span>' + esc(jobLabel(S.job)) + '…<small>'
      + (S.job.status === 'RUNNING' ? '処理中' : '始まるのを待っています') + '（' + sec + ' 秒）</small></span>';
    el.classList.add('on');
    return;
  }
  el.innerHTML = '<span class="bc">' + YOMI_POSE.observe + '</span><span>観測中…<small>処理しています</small></span>';
  if (S.pending > 0) busyT = setTimeout(function(){ el.classList.add('on'); }, 600); else el.classList.remove('on');
}
/** 読むだけの入口（同時に呼んでよい）。それ以外は書き込みで、終わるまで次の書き込みを受け付けない */
var READS = { apiBootstrap: 1, apiListDirectory: 1, apiListSettings: 1, apiListAudit: 1, apiHealth: 1, apiJobStatus: 1, apiListPlans: 1, apiForecastLatest: 1, apiPlanView: 1 };

// ---- 時間のかかる処理（裏で動かし、数秒ごとに状態を尋ねる。通信が長く続いて切れるのを避ける） ----
var JOB_LABEL = { 'MIGRATION.DRYRUN': '旧ブックを読んでいます', 'MIGRATION.IMPORT': '取り込んでいます',
  'FORECAST.PARITY': '計算の一致を確かめています（1/2 旧ブックの写し）', 'FORECAST.PARITY_B': '計算の一致を確かめています（2/2 データ本体）',
  'FORECAST.RUN': '予測の準備をしています（1/3 データの組み立て）', 'FORECAST.RUN_CALC': '予測を計算しています（2/3）', 'FORECAST.RUN_SAVE': '予測を保存しています（3/3）',
  'PLAN.VIEW_CHECK': '画面の中身を確かめています', 'SYSTEM.RECOVER': '保存の続きを書いています' };
var PLAN_STEP = { 'PLAN.RUN': '準備しています（1/3 データの組み立て）', 'PLAN.RUN_CALC': '実行しています（2/3）', 'PLAN.RUN_SAVE': '保存しています（3/3）' };
/** 処理の表示名（計画への保存・実行は操作の名前で） */
function jobLabel(j){
  if (!j) return '';
  if (/^PLAN\.(EDIT|RUN)/.test(j.kind)) {
    var a = fcActionLabel(j.payload && j.payload.action);
    return j.kind === 'PLAN.EDIT' ? a + '：保存しています' : a + '：' + (PLAN_STEP[j.kind] || '処理しています');
  }
  return JOB_LABEL[j.kind] || '処理しています';
}
var JOB_DONE = {
  'MIGRATION.DRYRUN': function(r, payload){ S.view = 'migrate'; S.mig.url = payload.bookUrl || S.mig.url; S.mig.dry = r; },
  'MIGRATION.IMPORT': function(r, payload){ S.view = 'migrate'; S.mig.url = payload.bookUrl || S.mig.url; S.mig.result = r; toast(r.unchanged ? '変更はありませんでした' : '取り込みました'); loadPlans(); },
  'FORECAST.PARITY_B': function(r){ S.view = 'migrate'; S.mig.parity = r; toast(r.same ? '計算が完全に一致しました' : '計算に違いがありました', !r.same); },
  // 旧来の計算が入力の確認を求めたとき（極端な入力値など）は、内容を見せて、続けるときだけもう一度動かす（計算の処理が返す）
  'FORECAST.RUN_CALC': function(r, payload){ JOB_DONE['FORECAST.RUN'](r, payload); },
  'FORECAST.RUN': function(r, payload){
    S.view = 'forecast';
    if (!r || !r.needConfirm) return;
    // 確認は画面の中のカードで聞く（別のタブを見ている間に終わると、ブラウザが確認の窓を出さずに「やめる」にするため）
    S.fc.confirm = { key: r.needConfirm.key, title: r.needConfirm.title || '確認', message: r.needConfirm.message || '', planId: payload.planId, confirms: payload.confirms || [] };
    S.fc.tab = 'forecast';
    toast('予測の前に確認があります', false);
  },
  'FORECAST.RUN_SAVE': function(r){ S.view = 'forecast'; toast('予測を保存しました'); loadForecast(r.planId); },
  'PLAN.VIEW_CHECK': function(r){ S.view = 'migrate'; S.mig.viewCheck = r; toast(r.same ? '画面の中身は旧来と同じでした' : '画面の中身に違いがありました', !r.same); },
  'PLAN.EDIT': function(r){ S.view = 'forecast'; toast(r.changed && r.changed.length ? '保存しました' : '変更はありませんでした'); loadForecast(r.planId); },
  'PLAN.RUN_SAVE': function(r){ S.view = 'forecast'; toast(fcActionLabel(r.action) + ' が終わりました'); loadForecast(r.planId); },
  'SYSTEM.RECOVER': function(r){ toast(r && r.nothing ? '書きかけの保存はありませんでした' : '保存の続きを書きました'); if (S.view === 'forecast' && S.fc.planId) loadForecast(S.fc.planId, true); }
};
function startJob(kind, payload){
  if (S.job || S.starting) return;   // すでに動いている・始めている途中なら何もしない
  S.starting = true;
  S.lastError = null;
  call('apiStartJob', [{ kind: kind, payload: payload }], function(r){ S.starting = false; watchJob({ jobId: r.jobId, kind: kind, payload: payload, status: r.status }); },
    function(){ S.starting = false; });
}
function watchJob(j){
  S.job = { id: j.jobId, kind: j.kind, payload: j.payload || {}, status: j.status, started: Date.now(), fails: 0 };
  busy(0);
  setTimeout(pollJob, 2500);
}
function pollJob(){
  var j = S.job;
  if (!j) return;
  var done = function(){ S.job = null; busy(0); };
  google.script.run.withSuccessHandler(function(st){
    if (!S.job || S.job.id !== j.id) return;
    if (st.status === 'CONTINUED') { j.id = st.nextJobId; j.kind = st.nextKind || j.kind; j.status = 'QUEUED'; busy(0); setTimeout(pollJob, 3000); return; }
    if (st.status === 'DONE') { done(); (JOB_DONE[j.kind] || function(){})(st.result, st.payload || j.payload); render(); return; }
    if (st.status === 'FAILED' || st.status === 'STALLED' || st.status === 'LOST') { done(); toast(st.error || '処理が止まりました', true); render(); return; }
    j.status = st.status; j.fails = 0; busy(0);
    if ($('jobBox')) $('jobBox').innerHTML = jobBanner();   // 進みの表示だけを新しくする（入力中の欄を消さない）
    setTimeout(pollJob, 3000);
  }).withFailureHandler(function(e){
    if (!S.job || S.job.id !== j.id) return;
    j.fails++;
    if (j.fails >= 5) { done(); toast('処理の状態を確かめられません: ' + ((e && e.message) || e), true); return; }
    setTimeout(pollJob, 5000);   // 一時的な通信の失敗は、少し待って尋ね直す（処理は裏で続いている）
  }).apiJobStatus({ jobId: j.id });
}
/** サーバーの api* を呼ぶ。失敗は通知に出す（入力は消さない） */
function call(fn, args, ok, fail){
  var write = !READS[fn];
  if (write && S.writing) return;   // 押した直後にもう一度押しても、前の処理が終わるまで受け付けない（何も出さない）
  if (write) S.writing = true;
  busy(1);

    + '<div class="card-foot">' + (b.enabled ? '' : '<button class="btn" onclick="call(\'apiEnableBackup\', [], function(){ toast(\'毎日のバックアップを有効にしました\'); go(\'health\'); })">毎日のバックアップを有効にする</button>')
    + '<button class="btn btn-ghost" onclick="call(\'apiRunBackup\', [], function(r){ toast(\'バックアップしました\'); go(\'health\'); })">今すぐバックアップ</button></div></div>'
    + '<div class="card"><h2>ファイル</h2><div class="row mt0">' + (f.folder ? '<a class="btn btn-ghost" target="_blank" href="' + esc(f.folder) + '">フォルダ</a>' : '') + (f.data ? '<a class="btn btn-ghost" target="_blank" href="' + esc(f.data) + '">データ本体</a>' : '') + (f.log ? '<a class="btn btn-ghost" target="_blank" href="' + esc(f.log) + '">今年度のログ</a>' : '') + '</div><p class="note mt8">データ本体は直接編集しないでください（画面からの変更だけが記録に残ります）。</p></div>';
}

render();
if (B.activeJob) { if (B.activeJob.payload && B.activeJob.payload.bookUrl) S.mig.url = B.activeJob.payload.bookUrl; if (/^MIGRATION\./.test(B.activeJob.kind)) S.view = 'migrate'; if (/^(PLAN|FORECAST\.RUN)/.test(B.activeJob.kind)) go('forecast'); render(); watchJob(B.activeJob); }
</script>
</body>
</html>
