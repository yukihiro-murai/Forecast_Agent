<!DOCTYPE html><html lang="ja"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#202124;--muted:#687078;--line:#dfe3e7;--soft:#f7f8f9;--blue:#185abc;--blue-soft:#eaf2ff;--green:#137333;--red:#b3261e;--amber-soft:#fef7e0}*{box-sizing:border-box}body{margin:0;padding:20px 18px 92px;color:var(--ink);font:14px/1.55 Arial,"Noto Sans JP",sans-serif;background:#fff}h1{margin:0;font-size:21px;line-height:1.3}h2{margin:0 0 5px;font-size:17px}.meta,.hint{color:var(--muted);font-size:12px}.hidden{display:none!important}.progress{display:flex;align-items:center;gap:10px;margin:17px 0 22px}.progress-track{height:4px;flex:1;border-radius:99px;background:#e9ecef;overflow:hidden}.progress-track span{display:block;height:100%;background:var(--blue);transition:width .2s}.progress-label{min-width:66px;color:var(--muted);font-size:11px;text-align:right}.forecast{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin:15px 0;padding:13px 14px;border:1px solid var(--line);border-radius:9px;background:var(--soft)}.forecast-label{color:var(--muted);font-size:12px}.forecast-value{grid-row:1/3;grid-column:2;color:#17365d;font-size:22px;font-weight:700;align-self:center}.forecast-range{font-size:11px;color:var(--muted)}.request{margin:12px 0;padding:11px 12px;border-left:3px solid #d89b00;background:var(--amber-soft)}.step{animation:enter .16s ease}@keyframes enter{from{opacity:.35;transform:translateX(5px)}to{opacity:1;transform:none}}.lead{margin:0 0 15px;color:var(--muted)}label{display:block;margin-top:14px;font-weight:700}input,textarea{width:100%;min-height:44px;margin-top:6px;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:92px;resize:vertical}input:focus,textarea:focus,button:focus-visible{outline:3px solid #a8c7fa;outline-offset:2px;border-color:var(--blue)}.delta,.final{display:flex;justify-content:space-between;gap:12px;margin-top:10px;padding:11px 12px;border-radius:7px;background:var(--soft)}.delta span,.final span{color:var(--muted)}.final strong{color:#17365d;font-size:18px}.dashboard-link{width:100%;min-height:42px;margin-top:9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--blue);font-weight:700;cursor:pointer}.months{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.months label{margin:0;color:var(--muted);font-size:11px}.months input{min-height:39px;padding:7px;text-align:right}.quarters{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.quarter{display:flex;justify-content:space-between;padding:8px 10px;border-radius:6px;background:var(--soft)}.secondary-action{width:100%;min-height:42px;border:1px solid var(--blue);border-radius:7px;background:#fff;color:var(--blue);font-weight:700;cursor:pointer}.error,.success{margin:12px 0;padding:11px;border-radius:7px}.error{color:var(--red);background:#fce8e6}.success{color:var(--green);background:#e6f4ea;font-weight:700}.actions{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:auto 1fr;gap:8px;padding:11px 16px 15px;border-top:1px solid var(--line);background:rgba(255,255,255,.98)}button.nav{min-height:44px;padding:10px 14px;border-radius:7px;font-weight:700;cursor:pointer}.back{border:1px solid var(--line);background:#fff;color:#3c4043}.primary{border:0;background:var(--blue);color:#fff}.primary:disabled,.back:disabled{opacity:.45;cursor:not-allowed}@media(max-width:360px){.months{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.step,.progress-track span{animation:none;transition:none}}
</style></head><body><div id="loading" role="status" aria-live="polite">計画案を準備しています…</div><main id="app" class="hidden"><h1>年度計画を決める</h1><div id="meta" class="meta"></div><div id="changeRequest" class="request hidden"><strong>差戻し内容</strong><div id="changeRequestText"></div></div><section class="forecast"><div class="forecast-label">システム推奨予測</div><div id="systemRecommended" class="forecast-value"></div><div id="range" class="forecast-range"></div></section><button id="openDashboard" type="button" class="dashboard-link">予測の根拠をダッシュボードで見る</button><div class="progress"><div class="progress-track"><span id="progressBar"></span></div><div id="progressLabel" class="progress-label"></div></div>
<section class="step" data-step="adoption"><h2>この予測を採用しますか？</h2><p class="lead">責任者として採用する着地見込みを決めます。システム推奨をそのまま使う場合は変更不要です。</p><label>採用予測（円）<input id="adoptedAmount" type="number" min="0" step="1" required></label><label>変更した理由（同額なら不要）<textarea id="adoptionReason" maxlength="1000" placeholder="例：予測後に確認済み契約が更新された"></textarea></label><div class="delta"><span>システム推奨との差</span><strong id="adoptionDifference"></strong></div></section>
<section class="step hidden" data-step="uplift"><h2>営業目標を上積みしますか？</h2><p class="lead">予測とは分けて、追加で取りにいく目標額を入力します。上積みしない場合は0円のまま提出できます。</p><label>営業上積み（円）<input id="salesUplift" type="number" min="0" step="1" value="0"></label><div class="final"><span>最終予算</span><strong id="finalBudget"></strong></div></section>
<section class="step hidden" data-step="action"><h2>上積みの実行方法を決めます</h2><p class="lead">目標を行動へ変えるために、責任者・期限・具体策を残します。</p><label>上積みする理由<textarea id="upliftReason" maxlength="1000"></textarea></label><label>責任者<input id="upliftOwner" maxlength="200" placeholder="氏名または担当チーム"></label><label>具体的な行動<textarea id="upliftAction" maxlength="1000" placeholder="誰に、何を、いつまでに行うか"></textarea></label><label>期限<input id="upliftDueDate" type="date"></label></section>
<section class="step hidden" data-step="allocation"><h2>上積みを月へ配分します</h2><p class="lead">迷う場合は、予測の季節配分をそのまま利用できます。</p><button id="autoAllocate" type="button" class="secondary-action">予測の季節配分を使う</button><div id="months" class="months"></div><div class="quarters"><div class="quarter"><strong>Q1</strong><span id="q0">¥0</span></div><div class="quarter"><strong>Q2</strong><span id="q1">¥0</span></div><div class="quarter"><strong>Q3</strong><span id="q2">¥0</span></div><div class="quarter"><strong>Q4</strong><span id="q3">¥0</span></div></div><div class="delta"><span>月次配分の合計</span><strong id="allocationTotal">¥0</strong></div></section><div id="message" role="alert" aria-live="assertive" tabindex="-1"></div><div class="actions"><button id="backButton" type="button" class="nav back" disabled>戻る</button><button id="nextButton" type="button" class="nav primary" disabled>次へ</button></div></main>
<script>
let model=null,currentStep='adoption',busy=false;const $=id=>document.getElementById(id),money=v=>`${Number(v)<0?'-':''}¥${Math.abs(Math.trunc(Number(v)||0)).toLocaleString('ja-JP')}`,esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function number(id){const value=$(id).value;return value===''?0:Number(value)}function monthValues(){return[...document.querySelectorAll('.month-value')].map(input=>input.value===''?0:Number(input.value))}function flow(){return number('salesUplift')>0?['adoption','uplift','action','allocation']:['adoption','uplift']}function payload(){return{adoptionDelta:number('adoptedAmount')-Number(model.systemRecommended),adoptionReason:$('adoptionReason').value,salesUplift:number('salesUplift'),upliftReason:$('upliftReason').value,upliftOwner:$('upliftOwner').value,upliftAction:$('upliftAction').value,upliftDueDate:$('upliftDueDate').value,monthAllocation:monthValues(),previewHash:''}}
function updateTotals(){if(!model)return;const adopted=number('adoptedAmount'),uplift=number('salesUplift'),values=monthValues();$('adoptionDifference').textContent=money(adopted-Number(model.systemRecommended));$('finalBudget').textContent=money(adopted+uplift);for(let q=0;q<4;q++)$('q'+q).textContent=money(values.slice(q*3,q*3+3).reduce((a,b)=>a+b,0));$('allocationTotal').textContent=money(values.reduce((a,b)=>a+b,0));$('message').innerHTML='';if(currentStep==='uplift')showStep('uplift')}
function showStep(key){currentStep=key;document.querySelectorAll('[data-step]').forEach(section=>section.classList.toggle('hidden',section.dataset.step!==key));const steps=flow(),index=Math.max(0,steps.indexOf(key));$('progressBar').style.width=`${((index+1)/steps.length)*100}%`;$('progressLabel').textContent=`${index+1} / ${steps.length}`;$('backButton').disabled=index===0||busy;$('nextButton').textContent=index===steps.length-1?'管理者へ提出':'次へ';window.scrollTo({top:0,behavior:'smooth'})}
function validateStep(){if(currentStep==='adoption'){if(!$('adoptedAmount').reportValidity())return false;const changed=number('adoptedAmount')!==Number(model.systemRecommended);$('adoptionReason').required=changed;if(changed&&!$('adoptionReason').reportValidity())return false}if(currentStep==='uplift'&&!$('salesUplift').reportValidity())return false;if(currentStep==='action'){for(const id of ['upliftReason','upliftOwner','upliftAction','upliftDueDate']){$(id).required=true;if(!$(id).reportValidity())return false}}if(currentStep==='allocation'){const sum=monthValues().reduce((a,b)=>a+b,0);if(Math.trunc(sum)!==Math.trunc(number('salesUplift'))){showError(new Error('月次配分の合計を営業上積み額と一致させてください。'));return false}}return true}
function next(){if(busy||!validateStep())return;const steps=flow(),index=steps.indexOf(currentStep);if(index===steps.length-1){submit();return}showStep(steps[index+1])}function back(){const steps=flow(),index=steps.indexOf(currentStep);if(index>0)showStep(steps[index-1])}function allocate(){const total=Math.max(0,Math.trunc(number('salesUplift'))),weights=model.monthWeights||new Array(12).fill(1/12);let used=0;document.querySelectorAll('.month-value').forEach((input,i)=>{const value=i===11?total-used:Math.trunc(total*Number(weights[i]||0));input.value=value;used+=value});updateTotals()}
function showError(error){busy=false;$('nextButton').disabled=false;$('nextButton').textContent=currentStep===flow()[flow().length-1]?'管理者へ提出':'次へ';$('message').innerHTML=`<div class="error">${esc(error&&error.message?error.message:error)}</div>`;$('message').focus()}function submit(){busy=true;$('nextButton').disabled=true;$('backButton').disabled=true;$('nextButton').textContent='提出しています…';google.script.run.withSuccessHandler(result=>{$('message').innerHTML=`<div class="success">${esc(result.message)}<div class="hint" style="margin-top:4px">画面は開いたままです。提出した計画を見直せます。</div></div>`;$('nextButton').textContent='提出しました';$('message').focus()}).withFailureHandler(showError).vNextSubmitPlan(payload())}
function render(data){model=data;$('loading').classList.add('hidden');$('app').classList.remove('hidden');$('nextButton').disabled=false;$('meta').textContent=`${data.clientName}｜FY${data.fiscalYear}｜${data.stateLabel}`;$('systemRecommended').textContent=money(data.systemRecommended);$('range').textContent=`通常の振れ幅 ${money(data.range.p10)} ～ ${money(data.range.p90)}`;$('adoptedAmount').value=Number(data.systemRecommended)||0;if(data.changeRequestReason){$('changeRequest').classList.remove('hidden');$('changeRequestText').textContent=data.changeRequestReason}const labels=data.monthLabels||[];$('months').innerHTML=labels.map((label,i)=>`<label>${esc(label)}<input class="month-value" data-index="${i}" type="number" min="0" step="1" value="0" aria-label="${esc(label)}の営業上積み"></label>`).join('');const p=data.previousPlan;if(p){$('adoptedAmount').value=Number(data.systemRecommended)+Number(p.adoptionDelta||0);$('adoptionReason').value=p.adoptionReason||'';$('salesUplift').value=p.salesUplift||0;$('upliftReason').value=p.upliftReason||'';$('upliftOwner').value=p.upliftOwner||'';$('upliftAction').value=p.upliftAction||'';$('upliftDueDate').value=(p.upliftDueDate||'').replaceAll('/','-');document.querySelectorAll('.month-value').forEach((input,i)=>input.value=(p.monthAllocation||[])[i]||0)}document.querySelectorAll('input,textarea').forEach(input=>input.addEventListener('input',updateTotals));updateTotals();showStep('adoption')}
$('nextButton').addEventListener('click',next);$('backButton').addEventListener('click',back);$('autoAllocate').addEventListener('click',allocate);$('openDashboard').addEventListener('click',()=>google.script.run.vNextOpenForecastDashboard());google.script.run.withSuccessHandler(render).withFailureHandler(error=>{$('loading').innerHTML=`<div class="error">${esc(error&&error.message?error.message:error)}</div>`}).vNextGetPlanEditorModel();
</script></body></html>
