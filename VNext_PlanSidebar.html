<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--navy:#17324d;--blue:#1769aa;--teal:#167d76;--red:#b3261e;--text:#1f2933;--muted:#64717d;--line:#dce2e7;--soft:#f5f7f9;--blue-soft:#edf5fb;--amber-soft:#fff7e6}
    *{box-sizing:border-box}body{margin:0;padding:18px 18px 88px;color:var(--text);font:14px/1.55 Arial,"Noto Sans JP",sans-serif}h1{margin:0 0 3px;color:var(--navy);font-size:22px;line-height:1.3}h2{margin:22px 0 8px;color:var(--navy);font-size:15px}.meta,.hint{color:var(--muted);font-size:12px}.hidden{display:none!important}
    .headline{margin-top:14px;padding:14px;border:1px solid #c9dff0;border-radius:9px;background:var(--blue-soft)}.headline-label{color:var(--muted);font-size:11px}.headline-value{color:var(--navy);font-size:24px;font-weight:700}.headline-range{margin-top:3px;color:#43515c;font-size:12px}
    details{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:#fff}summary{padding:11px 12px;color:var(--navy);font-weight:700;cursor:pointer}.detail-body{padding:0 12px 12px}.layer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-top:1px solid #edf0f2}.layer:first-child{border-top:0}.layer small{display:block;color:var(--muted)}.layer strong{white-space:nowrap}.insight{padding:8px 0;border-top:1px solid #edf0f2}.insight:first-child{border-top:0}.badge{display:inline-block;margin-right:4px;padding:2px 6px;border-radius:999px;background:var(--soft);color:#52606b;font-size:10px;font-weight:700}.badge.apply{background:#edf7f5;color:#0f655f}
    .request{margin:12px 0;padding:11px;border-left:4px solid #d89b00;background:var(--amber-soft);border-radius:5px}label{display:block;margin-top:13px;font-weight:700}input,textarea{width:100%;min-height:42px;margin-top:5px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font:inherit}textarea{min-height:76px;resize:vertical}input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid #9fc5e8;outline-offset:2px;border-color:var(--blue)}
    .delta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding:10px 11px;border-radius:7px;background:var(--soft)}.delta strong{color:var(--navy)}.months{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.months label{margin-top:5px;color:var(--muted);font-size:11px}.months input{min-height:38px;padding:6px;text-align:right}.quarters{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:9px}.quarter{padding:8px;border-radius:5px;background:var(--soft);text-align:right}.quarter strong{float:left}.secondary{width:100%;min-height:42px;border:1px solid var(--blue);border-radius:6px;background:#fff;color:var(--blue);font-weight:700;cursor:pointer}
    .final{margin-top:17px;padding:13px;border-top:2px solid var(--navy);border-bottom:1px solid var(--line)}.final-row{display:flex;justify-content:space-between;gap:8px;align-items:center}.final strong{color:var(--navy);font-size:20px}.message{margin-top:10px}.error,.success{padding:11px;border-radius:7px}.error{color:var(--red);background:#fce8e6}.success{color:#0f655f;background:#edf7f5;font-weight:700}
    .actions{position:fixed;left:0;right:0;bottom:0;padding:11px 16px 15px;border-top:1px solid var(--line);background:rgba(255,255,255,.97)}.primary{width:100%;min-height:45px;border:0;border-radius:7px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.primary:disabled{opacity:.48;cursor:default}
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">計画案を準備しています…</div>
  <main id="app" class="hidden">
    <h1>年度計画案</h1><div id="meta" class="meta"></div>
    <div id="changeRequest" class="request hidden"><strong>差戻し内容</strong><div id="changeRequestText"></div></div>
    <section class="headline"><div class="headline-label">システム推奨予測</div><div id="systemRecommended" class="headline-value"></div><div id="range" class="headline-range"></div></section>
    <p class="hint" style="margin-top:7px">予測は現在の情報から見た着地見込みです。採用判断と営業目標は、この予測と分けて記録します。</p>
    <details open><summary>予測ができるまでの積み上げ</summary><div id="layerList" class="detail-body"></div></details>
    <details id="aiDetails"><summary>AI外部調査の要点</summary><div id="aiList" class="detail-body"></div></details>

    <h2>1. 採用する見込み</h2>
    <label>採用予測（円）<input id="adoptedAmount" type="number" min="0" step="1" required></label>
    <p class="hint">そのまま採用する場合は変更不要です。変えた場合だけ理由を入力します。</p>
    <label>変更した理由（同額なら不要）<textarea id="adoptionReason" maxlength="1000" placeholder="例：予測時点では未反映だった確認済み契約を加えた"></textarea></label>
    <div class="delta"><span>システム推奨との差</span><strong id="adoptionDifference"></strong></div>

    <h2>2. 営業上積み</h2>
    <label>営業上積み（円）<input id="salesUplift" type="number" min="0" step="1" value="0"></label>
    <p class="hint">目標として追加で取りにいく金額です。0円なら追加入力はありません。</p>
    <section id="upliftFields" class="hidden">
      <label>上積みする理由<textarea id="upliftReason" maxlength="1000"></textarea></label>
      <label>責任者<input id="upliftOwner" maxlength="200" placeholder="氏名または担当チーム"></label>
      <label>具体的な行動<textarea id="upliftAction" maxlength="1000" placeholder="誰に、何を、いつまでに行うか"></textarea></label>
      <label>期限<input id="upliftDueDate" type="date"></label>
      <h2>月への配分</h2><button id="autoAllocate" type="button" class="secondary">予測の季節配分を使う</button>
      <div id="months" class="months"></div>
      <div class="quarters"><div class="quarter"><strong>Q1</strong><span id="q0">¥0</span></div><div class="quarter"><strong>Q2</strong><span id="q1">¥0</span></div><div class="quarter"><strong>Q3</strong><span id="q2">¥0</span></div><div class="quarter"><strong>Q4</strong><span id="q3">¥0</span></div></div>
      <div class="delta"><span>月次配分の合計</span><strong id="allocationTotal">¥0</strong></div>
    </section>
    <section class="final"><div class="final-row"><span>最終予算</span><strong id="finalBudget"></strong></div><div class="hint">採用予測＋営業上積み</div></section>
    <div id="message" class="message" role="alert" aria-live="assertive" tabindex="-1"></div>
  </main>
  <div class="actions"><button id="submitButton" type="button" class="primary" disabled>この計画案を提出</button></div>
  <script>
    let model=null;const $=id=>document.getElementById(id);const money=v=>`${Number(v)<0?'-':''}¥${Math.abs(Math.round(Number(v)||0)).toLocaleString('ja-JP')}`;const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function number(id){const value=$(id).value;return value===''?0:Number(value)}function monthValues(){return[...document.querySelectorAll('.month-value')].map(input=>input.value===''?0:Number(input.value))}
    function payload(){return{adoptionDelta:number('adoptedAmount')-Number(model.systemRecommended),adoptionReason:$('adoptionReason').value,salesUplift:number('salesUplift'),upliftReason:$('upliftReason').value,upliftOwner:$('upliftOwner').value,upliftAction:$('upliftAction').value,upliftDueDate:$('upliftDueDate').value,monthAllocation:monthValues(),previewHash:''}}
    function updateTotals(){if(!model)return;const adopted=number('adoptedAmount'),uplift=number('salesUplift'),hasUplift=uplift>0;$('adoptionDifference').textContent=money(adopted-Number(model.systemRecommended));$('finalBudget').textContent=money(adopted+uplift);$('upliftFields').classList.toggle('hidden',!hasUplift);['upliftReason','upliftOwner','upliftAction','upliftDueDate'].forEach(id=>$(id).required=hasUplift);const values=monthValues();for(let q=0;q<4;q++)$('q'+q).textContent=money(values.slice(q*3,q*3+3).reduce((a,b)=>a+b,0));$('allocationTotal').textContent=money(values.reduce((a,b)=>a+b,0));$('message').innerHTML=''}
    function renderLayers(data){const rows=data&&data.rows||[];$('layerList').innerHTML=rows.map(row=>`<div class="layer"><div><span>${esc(row.label)}</span><small>${esc(row.description)}</small></div><strong>${money(row.amount)}</strong></div>`).join('')||'<div class="hint">積み上げ情報はありません。</div>'}
    function renderAi(items){$('aiList').innerHTML=(items||[]).map(item=>{const link=/^https?:\/\//i.test(item.sourceUrl||'')?`<a href="${esc(item.sourceUrl)}" target="_blank" rel="noopener">出典を開く</a>`:'';return `<div class="insight"><span class="badge">${esc(item.axisLabel||'外部環境')}</span><span class="badge ${item.forecastUse==='APPLY'?'apply':''}">${esc(item.useLabel||'参考')}</span><div style="margin-top:5px">${esc(item.summary||item.target)}</div>${item.humanQuestion?`<div class="hint">確認：${esc(item.humanQuestion)}</div>`:''}${link?`<div class="hint" style="margin-top:4px">${link}</div>`:''}</div>`}).join('')||'<div class="hint">今回表示できるAI外部情報はありません。</div>'}
    function showError(error){$('submitButton').disabled=false;$('submitButton').textContent='この計画案を提出';$('message').innerHTML=`<div class="error">${esc(error&&error.message?error.message:error)}</div>`;$('message').focus()}
    function allocate(){const total=Math.max(0,Math.round(number('salesUplift'))),weights=model.monthWeights||new Array(12).fill(1/12);let used=0;document.querySelectorAll('.month-value').forEach((input,i)=>{const value=i===11?total-used:Math.round(total*Number(weights[i]||0));input.value=value;used+=value});updateTotals()}
    function render(data){model=data;$('loading').classList.add('hidden');$('app').classList.remove('hidden');$('submitButton').disabled=false;$('meta').textContent=`${data.clientName}｜FY${data.fiscalYear}｜${data.stateLabel}`;$('systemRecommended').textContent=money(data.systemRecommended);$('range').textContent=`通常の振れ幅 ${money(data.range.p10)} ～ ${money(data.range.p90)}`;$('adoptedAmount').value=Number(data.systemRecommended)||0;if(data.changeRequestReason){$('changeRequest').classList.remove('hidden');$('changeRequestText').textContent=data.changeRequestReason}renderLayers(data.layerBreakdown);renderAi(data.aiEvidence);const labels=data.monthLabels||[];$('months').innerHTML=labels.map((label,i)=>`<label>${esc(label)}<input class="month-value" data-index="${i}" type="number" min="0" step="1" value="0" aria-label="${esc(label)}の営業上積み"></label>`).join('');const p=data.previousPlan;if(p){$('adoptedAmount').value=Number(data.systemRecommended)+Number(p.adoptionDelta||0);$('adoptionReason').value=p.adoptionReason||'';$('salesUplift').value=p.salesUplift||0;$('upliftReason').value=p.upliftReason||'';$('upliftOwner').value=p.upliftOwner||'';$('upliftAction').value=p.upliftAction||'';$('upliftDueDate').value=(p.upliftDueDate||'').replaceAll('/','-');document.querySelectorAll('.month-value').forEach((input,i)=>input.value=(p.monthAllocation||[])[i]||0)}document.querySelectorAll('input,textarea').forEach(input=>input.addEventListener('input',updateTotals));updateTotals()}
    function submit(){const required=['adoptedAmount',...(number('salesUplift')>0?['upliftReason','upliftOwner','upliftAction','upliftDueDate']:[])];if(!required.every(id=>$(id).reportValidity()))return;$('submitButton').disabled=true;$('submitButton').textContent='提出しています…';google.script.run.withSuccessHandler(result=>{$('message').innerHTML=`<div class="success">${esc(result.message)}</div>`;setTimeout(()=>google.script.host.close(),1200)}).withFailureHandler(showError).vNextSubmitPlan(payload())}
    $('submitButton').addEventListener('click',submit);$('autoAllocate').addEventListener('click',allocate);google.script.run.withSuccessHandler(render).withFailureHandler(error=>{$('loading').innerHTML=`<div class="error">${esc(error&&error.message?error.message:error)}</div>`}).vNextGetPlanEditorModel();
  </script>
</body>
</html>
