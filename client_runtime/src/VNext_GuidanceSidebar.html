<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root { --blue:#174ea6; --text:#202124; --muted:#5f6368; --line:#dadce0; --soft:#f8f9fa; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px; color:var(--text); font:14px/1.6 Arial,"Noto Sans JP",sans-serif; }
    .eyebrow { color:var(--blue); font-size:12px; font-weight:700; letter-spacing:.04em; }
    h1 { margin:5px 0 8px; font-size:21px; line-height:1.35; }
    .meta { color:var(--muted); font-size:12px; }
    .card { margin-top:18px; padding:16px; border:1px solid var(--line); border-radius:10px; background:var(--soft); }
    .card strong { display:block; margin-bottom:6px; font-size:16px; }
    .card p { margin:0; }
    button { width:100%; min-height:44px; margin-top:18px; border:0; border-radius:7px; padding:11px 14px; background:var(--blue); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button.secondary { background:#fff; color:var(--blue); border:1px solid var(--blue); }
    button:disabled { opacity:.5; cursor:default; }
    button:focus-visible { outline:3px solid #aecbfa; outline-offset:2px; }
    .hint { margin-top:12px; color:var(--muted); font-size:12px; }
    .error { padding:12px; border-radius:7px; background:#fce8e6; color:#b3261e; }
  </style>
</head>
<body>
  <div id="loading" role="status">案内を確認しています…</div>
  <main id="app" hidden>
    <div class="eyebrow" id="state"></div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <section class="card">
      <strong id="actionLabel"></strong>
      <p id="instruction"></p>
    </section>
    <button id="actionButton" type="button"></button>
    <button id="closeButton" type="button" class="secondary">閉じる</button>
    <div class="hint">この案内は上部メニュー「年度計画」→「ホーム・案内を表示」から、いつでも再表示できます。</div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let model = null;
    function text(value) { return String(value === undefined || value === null ? '' : value); }
    function render(data) {
      model = data;
      $('loading').hidden = true;
      $('app').hidden = false;
      $('state').textContent = data.stateLabel;
      $('title').textContent = '次にすること';
      $('meta').textContent = `${text(data.clientName)}｜FY${text(data.fiscalYear)}｜${text(data.roleLabel)}`;
      $('actionLabel').textContent = data.primaryAction.label;
      $('instruction').textContent = data.primaryAction.instruction;
      const waiting = data.primaryAction.key === 'WAIT';
      $('actionButton').hidden = waiting;
      $('actionButton').textContent = data.primaryAction.label;
    }
    function fail(error) {
      $('loading').innerHTML = `<div class="error">${text(error && error.message ? error.message : error)}</div>`;
    }
    $('actionButton').addEventListener('click', () => {
      $('actionButton').disabled = true;
      $('actionButton').textContent = '開いています…';
      google.script.run.withSuccessHandler(() => google.script.host.close())
        .withFailureHandler(error => { $('actionButton').disabled = false; $('actionButton').textContent = model.primaryAction.label; fail(error); })
        .vNextOpenCurrentAction();
    });
    $('closeButton').addEventListener('click', () => google.script.host.close());
    google.script.run.withSuccessHandler(render).withFailureHandler(fail).vNextGetClientViewModel();
  </script>
</body>
</html>
