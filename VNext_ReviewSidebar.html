<!DOCTYPE html><html lang="ja"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#202124;--muted:#687078;--line:#dfe3e7;--soft:#f7f8f9;--blue:#185abc;--green:#137333;--red:#b3261e}*{box-sizing:border-box}body{margin:0;padding:20px 18px 92px;color:var(--ink);font:14px/1.55 Arial,"Noto Sans JP",sans-serif}h1{margin:0;font-size:21px}h2{margin:0 0 5px;font-size:17px}.meta,.hint{color:var(--muted);font-size:12px}.hidden{display:none!important}.wait{margin-top:14px;padding:12px;background:#fef7e0;border-radius:7px}.progress{display:flex;align-items:center;gap:10px;margin:17px 0 22px}.track{height:4px;flex:1;background:#e9ecef;border-radius:99px;overflow:hidden}.track span{display:block;height:100%;background:var(--blue)}.progress-label{min-width:66px;color:var(--muted);font-size:11px;text-align:right}.step{animation:enter .16s ease}@keyframes enter{from{opacity:.35;transform:translateX(5px)}to{opacity:1;transform:none}}.numbers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.number{padding:11px;border:1px solid var(--line);border-radius:7px}.number span{display:block;color:var(--muted);font-size:11px}.number strong{display:block;margin-top:4px;color:#17365d;font-size:18px}details{margin-top:12px;border:1px solid var(--line);border-radius:7px}summary{padding:10px 11px;font-weight:700;cursor:pointer}.breakdown{padding:0 11px 10px}.breakdown-row{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px 0;border-top:1px solid var(--line)}.breakdown-row small{grid-column:1/-1;color:var(--muted)}.cause-grid{display:grid;gap:7px;margin-top:12px}.cause{display:flex;gap:8px;padding:10px;border:1px solid var(--line);border-radius:7px}.cause input{width:auto;margin:3px 0}.cause span{font-weight:400}label{display:block;margin-top:14px;font-weight:700}textarea,input{width:100%;min-height:44px;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:7px;font:inherit}textarea{min-height:92px;resize:vertical}input:focus,textarea:focus,button:focus-visible{outline:3px solid #a8c7fa;outline-offset:2px}.info-row{display:flex;gap:6px;margin-top:8px}.info-row input{margin:0}.remove{width:44px;border:1px solid var(--line);background:#fff}.secondary{min-height:42px;margin-top:9px;border:1px solid var(--blue);border-radius:7px;background:#fff;color:var(--blue);font-weight:700}.error,.success{margin:12px 0;padding:11px;border-radius:7px}.error{color:var(--red);background:#fce8e6}.success{color:var(--green);background:#e6f4ea;font-weight:700}.actions{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:auto 1fr;gap:8px;padding:11px 16px 15px;border-top:1px solid var(--line);background:#fff}.actions button{min-height:44px;padding:10px 14px;border-radius:7px;font-weight:700}.back{border:1px solid var(--line);background:#fff}.primary{border:0;background:var(--blue);color:#fff}.actions button:disabled{opacity:.45}@media(prefers-reduced-motion:reduce){.step{animation:none}}
</style></head><body><div id="loading" role="status" aria-live="polite">振り返りを準備しています…</div><main id="app" class="hidden"><h1>年度の振り返り</h1><div id="meta" class="meta"></div><div id="waitMessage" class="wait hidden" role="status" aria-live="polite"></div><section id="reviewFields"><p class="hint">評価するのは人ではなく、どの情報や仮説が役立ったかです。</p><div class="progress"><div class="track"><span id="progressBar"></span></div><div id="progressLabel" class="progress-label"></div></div>
<section class="step" data-step="result"><h2>まず結果を確認します</h2><p class="hint">事実の確認だけです。良し悪しの評価はしません。</p><div id="numbers" class="numbers hidden"><div class="number"><span>確定実績</span><strong id="actual"></strong></div><div class="number"><span>システム予測</span><strong id="system"></strong></div><div class="number"><span>採用予測</span><strong id="adopted"></strong></div><div class="number"><span>最終予算</span><strong id="budget"></strong></div></div><details id="breakdownSection" class="hidden"><summary>差の内訳を見る</summary><div id="breakdown" class="breakdown"></div></details></section>
<section class="step hidden" data-step="cause"><h2>差が生まれた理由を整理します</h2><p class="hint">主な原因カテゴリを1～3件選び、確認できた事実と仮説を分けてください。</p><div id="causeCategories" class="cause-grid"></div><label>確認できた原因<textarea id="confirmedCause" maxlength="1000" placeholder="例：契約開始が予定より2か月遅れた"></textarea></label><label>原因の仮説<textarea id="causeHypothesis" maxlength="1000" placeholder="例：更新判断の情報を得る時期が遅かった可能性"></textarea></label></section>
<section class="step hidden" data-step="next"><h2>次年度に確認する情報を決めます</h2><p class="hint">行動につながる具体的な情報を1～3件入力してください。</p><div id="nextInfo"></div><button id="addInfo" type="button" class="secondary">＋ もう1件追加</button></section><div id="message" role="alert" aria-live="assertive" tabindex="-1"></div><div class="actions"><button id="backButton" type="button" class="back" disabled>戻る</button><button id="nextButton" type="button" class="primary">次へ</button></div></section></main>
<script>
let model=null,currentStep='result',busy=false;const $=id=>document.getElementById(id),flow=['result','cause','next'],money=v=>`${Number(v)<0?'-':''}¥${Math.abs(Math.trunc(Number(v)||0)).toLocaleString('ja-JP')}`,esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function invalidate(){$('message').innerHTML=''}function addInfo(value=''){if(document.querySelectorAll('.info-value').length>=3)return;const row=document.createElement('div');row.className='info-row';row.innerHTML=`<input class="info-value" maxlength="300" placeholder="例：契約更新の意思決定月" value="${esc(value)}"><button type="button" class="remove" aria-label="削除">×</button>`;row.querySelector('input').addEventListener('input',invalidate);row.querySelector('button').addEventListener('click',()=>{if(document.querySelectorAll('.info-value').length>1){row.remove();$('addInfo').disabled=false}});$('nextInfo').appendChild(row);$('addInfo').disabled=document.querySelectorAll('.info-value').length>=3}function payload(){return{causeCategories:[...document.querySelectorAll('.cause-value:checked')].map(x=>x.value),confirmedCause:$('confirmedCause').value,causeHypothesis:$('causeHypothesis').value,nextInformation:[...document.querySelectorAll('.info-value')].map(x=>x.value),previewHash:''}}
function showStep(key){currentStep=key;document.querySelectorAll('[data-step]').forEach(section=>section.classList.toggle('hidden',section.dataset.step!==key));const i=flow.indexOf(key);$('progressBar').style.width=`${((i+1)/flow.length)*100}%`;$('progressLabel').textContent=`${i+1} / ${flow.length}`;$('backButton').disabled=i===0||busy;$('nextButton').textContent=i===flow.length-1?'振り返りを保存':'次へ';window.scrollTo({top:0,behavior:'smooth'})}function validate(){if(currentStep==='cause'){if(!document.querySelectorAll('.cause-value:checked').length){error(new Error('主な原因カテゴリを1件以上選択してください。'));return false}for(const id of ['confirmedCause','causeHypothesis']){if(!$(id).value.trim()){error(new Error(`${id==='confirmedCause'?'確認できた原因':'原因の仮説'}を入力してください。`));return false}}}if(currentStep==='next'&&![...document.querySelectorAll('.info-value')].some(x=>x.value.trim())){error(new Error('次年度に確認する情報を1件以上入力してください。'));return false}return true}function next(){if(busy||!validate())return;const i=flow.indexOf(currentStep);if(i===flow.length-1){save();return}showStep(flow[i+1])}function back(){const i=flow.indexOf(currentStep);if(i>0)showStep(flow[i-1])}
function error(e){busy=false;$('nextButton').disabled=false;$('nextButton').textContent=currentStep==='next'?'振り返りを保存':'次へ';$('message').innerHTML=`<div class="error">${esc(e&&e.message?e.message:e)}</div>`;$('message').focus()}function save(){busy=true;$('nextButton').disabled=true;$('backButton').disabled=true;$('nextButton').textContent='保存しています…';google.script.run.withSuccessHandler(result=>{$('message').innerHTML=`<div class="success">${esc(result.message)}<div class="hint" style="margin-top:4px">画面は開いたままです。</div></div>`;$('nextButton').textContent='保存しました';$('message').focus()}).withFailureHandler(error).vNextSaveReview(payload())}
function render(data){model=data;$('loading').classList.add('hidden');$('app').classList.remove('hidden');$('meta').textContent=`${data.clientName}｜FY${data.fiscalYear}`;if(!data.evaluation){$('reviewFields').classList.add('hidden');$('waitMessage').classList.remove('hidden');$('waitMessage').textContent='管理側で確定実績の評価を準備しています。現在、入力は不要です。';return}$('numbers').classList.remove('hidden');$('actual').textContent=money(data.evaluation.actualTotal);$('system').textContent=money(data.evaluation.systemForecast);$('adopted').textContent=money(data.evaluation.adoptedForecast);$('budget').textContent=money(data.evaluation.finalBudget);const rows=(data.evaluation.breakdown||[]).filter(x=>x.annual);if(rows.length){$('breakdownSection').classList.remove('hidden');$('breakdown').innerHTML=rows.map(x=>`<div class="breakdown-row"><span>${esc(x.label)}</span><strong>${esc(money(x.amount))}</strong><small>${esc(x.explanation)}</small></div>`).join('')}const p=data.previousReview||{},selected=p.causeCategories||[];$('causeCategories').innerHTML=(data.causeCategories||[]).map(x=>`<label class="cause"><input type="checkbox" class="cause-value" value="${esc(x.key)}" ${selected.includes(x.key)?'checked':''}><span>${esc(x.label)}</span></label>`).join('');document.querySelectorAll('.cause-value').forEach(x=>x.addEventListener('change',e=>{if(document.querySelectorAll('.cause-value:checked').length>3){e.target.checked=false;error(new Error('原因カテゴリは3つ以内で選択してください。'))}else invalidate()}));$('confirmedCause').value=p.confirmedCause||'';$('causeHypothesis').value=p.causeHypothesis||'';(p.nextInformation&&p.nextInformation.length?p.nextInformation:['']).slice(0,3).forEach(addInfo);showStep('result')}
$('nextButton').addEventListener('click',next);$('backButton').addEventListener('click',back);$('addInfo').addEventListener('click',()=>addInfo());google.script.run.withSuccessHandler(render).withFailureHandler(error=>{$('loading').innerHTML=`<div class="error">${esc(error&&error.message?error.message:error)}</div>`}).vNextGetReviewEditorModel();
</script></body></html>
