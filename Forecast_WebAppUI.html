<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クライアント別売上予測</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'><path d='M16 9V4.6' stroke='%230F3557' stroke-width='2.2' stroke-linecap='round'/><path d='M11 4a1.8 1.8 0 0 1 1.8-1.8h6.4l2.6 1.8-2.6 1.8h-6.4A1.8 1.8 0 0 1 11 4z' fill='%230F3557'/><path d='M19.4 2.6l2.4-2.6h2.2l-1.4 2.6zM19.4 5.4l2.4 2.6h2.2l-1.4-2.6z' fill='%230F3557'/><rect x='8.4' y='0.2' width='2.2' height='7.6' rx='1.1' fill='%237FC8F0'/><path d='M0.5 20.5C0.5 13 7.4 7.2 16 7.2S31.5 13 31.5 20.5V25.5a6.5 6.5 0 0 1-6.5 6.5H7A6.5 6.5 0 0 1 .5 25.5z' fill='%2329A0E2'/><rect x='3.6' y='13.6' width='24.8' height='15' rx='5.5' fill='%230F3557'/><circle cx='10.8' cy='19.8' r='2.8' fill='%238FE3FF'/><circle cx='21.2' cy='19.8' r='2.8' fill='%238FE3FF'/><path d='M12.4 24.2q3.6 2.6 7.2 0' stroke='%238FE3FF' stroke-width='2' fill='none' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#F4F7FB; --card:#FFFFFF;
  --primary:#00A0E9; --primary-dark:#0084C5; --primary-soft:#E5F4FD;
  --navy:#0F3557; --navy-deep:#0B2A47;
  --text:#24303E; --muted:#5A6B7E; --line:#DCE4EC; --line-soft:#EAF0F6;
  --warn-bg:#FFF6E8; --warn-fg:#A65C00; --warn-line:#F0D9B5;
  --error:#C0392B; --error-bg:#FDEDEC;
  --radius:14px; --radius-s:10px;
  --h-btn:44px; --h-nav:52px; --h-input:40px;
  --shadow:0 1px 2px rgba(15,53,87,.05), 0 6px 18px rgba(15,53,87,.06);
  --fontnum:"SF Mono","Consolas","Roboto Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#C6D3E0;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ===== header ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:60px;background:var(--navy);display:flex;align-items:center;padding:0 24px;z-index:60;color:#fff}
.topbar .logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin-right:12px}
.topbar .ttl{font-size:17px;font-weight:700;letter-spacing:.02em}
.topbar .book{margin-left:16px;font-size:13px;color:#B8CFE3;text-decoration:none;padding:6px 10px;border-radius:8px}
.topbar .book:hover{background:rgba(255,255,255,.12);color:#fff}
.topbar .spacer{flex:1}
.topbar .meta{font-size:13px;color:#B8CFE3;margin-left:14px}
.topbar .meta b{color:#fff;font-weight:600}
.progressbar{position:fixed;top:60px;left:0;right:0;height:3px;background:rgba(0,160,233,.15);z-index:70;opacity:0;transition:opacity .2s}
.progressbar.on{opacity:1}
.progressbar i{display:block;height:100%;width:40%;background:var(--primary);border-radius:2px;animation:slidebar 1.1s ease-in-out infinite}
@keyframes slidebar{0%{margin-left:-40%}100%{margin-left:100%}}

/* ===== layout ===== */
.layout{display:flex;padding-top:60px;min-height:100vh}
.sidenav{width:210px;flex:0 0 210px;position:sticky;top:60px;height:calc(100vh - 60px);padding:18px 12px;border-right:1px solid var(--line);background:#fff}
.navbtn{display:flex;align-items:center;gap:10px;width:186px;height:var(--h-nav);padding:0 16px;margin-bottom:6px;border-radius:var(--radius-s);font-size:15px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.navbtn svg{width:20px;height:20px;flex:0 0 20px}
.navbtn:hover{background:var(--primary-soft);color:var(--navy)}
.navbtn.on{background:var(--navy);color:#fff}
.navbtn .dot{margin-left:auto;width:8px;height:8px;border-radius:4px;background:var(--primary);display:none}
.navbtn .dot.err{background:var(--error)}
.main{flex:1;min-width:0;padding:24px 28px 60px;max-width:calc(100vw - 210px)}

/* ===== generic components ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:20px}
.card h2{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px}
.h2row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.h2row h2{margin-bottom:0}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.card .sub:empty{display:none}
/* ===== 工程リスト（1列・厳格グリッド） ===== */
.steplist{display:flex;flex-direction:column}
/* 全行同一グリッド: [accent 3][badge][title 1fr][help ?][status 96][meta 200][button 156] */
.stepitem{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.stepitem:last-child{border-bottom:none;padding-bottom:4px}
.stepitem:first-child{padding-top:2px}
.stepitem::before{content:'';width:3px;height:26px;border-radius:2px;background:transparent;flex:none}
.stepitem.st-pend::before{background:var(--primary)}
.stepitem.st-err::before{background:var(--error)}
.stepitem>.s-badge{flex:none}
.stepitem>.s-ttl{flex:1 1 auto;min-width:0;font-size:15px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepitem>.s-chip{flex:0 0 96px;text-align:right}
.stepitem>.s-meta{flex:0 0 200px;text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepitem>.s-meta.s-err{color:var(--error)}
.stepitem>.btn{flex:0 0 156px;width:156px;padding:0}
@media(max-width:720px){
 .stepitem>.s-ttl{flex:1 1 200px}
 .stepitem>.s-meta{flex:1 1 auto}
}
.ac-meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ac-err{font-size:12.5px;color:var(--error);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ⓘヘルプ: 押すと開くポップオーバー */
.qh{position:relative;display:inline-block;flex:none}
.qh>summary{list-style:none;cursor:pointer;width:22px;height:22px;border-radius:50%;background:#EAF3FB;color:var(--primary-dark);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1;user-select:none}
.qh>summary::-webkit-details-marker{display:none}
.qh>summary:hover{background:var(--primary-soft)}
.qh[open]>summary{background:var(--primary);color:#fff}
.qh>.qh-pop{position:absolute;top:calc(100% + 8px);left:0;z-index:70;min-width:280px;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(15,53,87,.18);padding:13px 15px;font-size:13px;line-height:1.6;color:var(--navy);font-weight:400;white-space:normal}
.qh.qr>.qh-pop{left:auto;right:0}
.tblscroll{max-height:460px;overflow-y:auto}
.tblscroll thead th{position:sticky;top:0;z-index:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--h-btn);min-width:120px;padding:0 22px;border-radius:var(--radius-s);font-size:15px;font-weight:700;transition:background .15s,transform .05s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover:not(:disabled){background:var(--navy-deep)}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn-ghost:hover:not(:disabled){border-color:var(--primary);color:var(--primary-dark)}
.btn-sm{height:36px;min-width:0;padding:0 16px;font-size:14px}
.btn-danger-ghost{background:#fff;color:var(--error);border:1.5px solid var(--line)}
.btn-danger-ghost:hover:not(:disabled){border-color:var(--error)}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip-ok{background:var(--primary-soft);color:var(--primary-dark)}
.chip-todo{background:#EDF1F5;color:var(--muted)}
.chip-err{background:var(--error-bg);color:var(--error)}
.chip-warn{background:var(--warn-bg);color:var(--warn-fg)}
.chip-navy{background:var(--navy);color:#fff}
.errstrip{display:none;margin:0 0 16px;padding:12px 16px;background:var(--error-bg);border:1px solid #F0C4BE;border-radius:var(--radius-s);color:var(--error);font-size:14px;font-weight:600}
.errstrip.on{display:block}
.warnbox{padding:12px 16px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--radius-s);color:var(--warn-fg);font-size:13.5px}
.note{font-size:12.5px;color:var(--muted)}
.kv{display:flex;gap:8px;align-items:baseline}

/* ===== tables ===== */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-s)}
table.tbl{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed}
.tbl th{background:#F0F5FA;color:var(--navy);font-size:13.5px;font-weight:700;padding:10px 12px;text-align:left;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#F8FBFE}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--fontnum);font-variant-numeric:tabular-nums}
.tbl tr.sum td{background:#F0F5FA;font-weight:700;border-top:2px solid var(--line)}
.tbl input,.tbl select{width:100%;height:34px;padding:0 8px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;background:#fff;transition:border-color .12s}
.tbl input:focus,.tbl select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,160,233,.15)}
.tbl input.num{text-align:right;font-family:var(--fontnum)}
.tbl td.num{white-space:nowrap}
.tbl td.locked{color:var(--muted)}
/* 編集済み行は1色の注意色で染める (参照アプリの tr.dirty 規約) */
.tbl tr.dirty td{background:var(--warn-bg)}
.tbl tr.dirty:hover td{background:#FDEFD8}
/* 横スクロールする表でも最終列（操作列）は右端に残す (参照アプリの sticky-right 規約) */
.tbl.stickyr th:last-child,.tbl.stickyr td:last-child{position:sticky;right:0;background:#fff;z-index:2;box-shadow:inset 1px 0 0 var(--line)}
.tbl.stickyr thead th:last-child{background:#F0F5FA;z-index:3}
.tbl.stickyr tr.sum td:last-child{background:#F0F5FA}
.tbl.stickyr tr:hover td:last-child{background:#F8FBFE}
.tbl.stickyr tr.dirty td:last-child{background:var(--warn-bg)}
.tbl.stickyr tr.dirty:hover td:last-child{background:#FDEFD8}
.cell-del{width:30px;height:30px;border-radius:7px;color:var(--muted);font-size:16px;line-height:1}
.cell-del:hover{background:var(--error-bg);color:var(--error)}

/* custom select */
.sel{position:relative;display:inline-block;width:100%}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:var(--h-input);padding:0 36px 0 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--text);cursor:pointer}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select{transition:border-color .12s,background-color .12s}
.sel select:hover:not(:disabled){border-color:var(--primary);background:#F7FBFE}
.sel select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,160,233,.15)}
.sel select:disabled{opacity:.6;background:#F4F6F8;cursor:not-allowed}
.sel:has(select:disabled)::after{opacity:.35}
.inp{width:100%;height:var(--h-input);padding:0 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;transition:border-color .12s}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,160,233,.15)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .charbox{animation:none}
  .progressbar i{animation:none}
  *{transition:none !important}
}
.flabel{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px;display:block}
.frow{display:grid;grid-template-columns:280px 160px 300px auto;gap:16px;align-items:end}
.frow .btn{height:var(--h-input)}

/* ===== home ===== */
.kpirow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);height:96px;padding:14px 18px;display:flex;flex-direction:column;justify-content:center}
.kpi .lbl{font-size:13px;color:var(--muted);font-weight:600}
.kpi .val{font-size:24px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;font-feature-settings:"palt";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted)}
.guide{display:flex;gap:16px;align-items:flex-start}
.charbox{width:72px;height:72px;flex:0 0 72px;cursor:pointer;animation:charfloat 3s ease-in-out 4;border:0;background:none;padding:0}
.charbox:hover{animation-play-state:paused}
@keyframes charfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.charbox.replay{animation:none}
.bubble{position:relative;background:var(--primary-soft);border-radius:var(--radius);padding:14px 18px;flex:1;font-size:14px;color:var(--navy)}
.bubble::before{content:"";position:absolute;left:-8px;top:20px;border:8px solid transparent;border-right-color:var(--primary-soft);border-left:none}
.bubble .act{margin-top:10px}
/* 空模様（案内役 よみ と天気キャラ。表示だけの判定） */
.wxchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wxline{margin-top:8px;font-size:12.5px;color:var(--muted)}
.wxchg{font-size:13px;font-weight:700;color:var(--warn-fg);margin-bottom:6px}
.busychar{position:fixed;right:24px;bottom:24px;width:210px;height:64px;display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);font-size:13px;font-weight:700;line-height:1.35;color:var(--navy);z-index:94;opacity:0;pointer-events:none;transition:opacity .2s}
.busychar.on{opacity:1}
.busychar small{font-size:12px;font-weight:600;color:var(--muted)}
.busychar .bc{width:48px;height:48px;flex:0 0 48px}
.toastchar{width:34px;height:34px;flex:0 0 34px;background:#fff;border-radius:50%;padding:2px}
.busychar svg,.toastchar svg,.charbox svg{width:100%;height:100%;display:block}

/* ===== forecast ===== */
.chartcard{padding:18px 22px}
#chart{width:100%;height:360px;display:block;cursor:pointer}
.legend{display:flex;gap:22px;font-size:12.5px;color:var(--muted);margin-top:8px;padding-left:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.meter{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#EDF1F5;margin:6px 0 12px}
.meter i{display:block;height:100%}
.meterrow{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.meterrow .v{text-align:right;font-family:var(--fontnum);color:var(--navy);font-weight:700}
.aiscores{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.aiscore{border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 14px}
.aiscore .n{font-size:13px;font-weight:700;color:var(--muted)}
.aiscore .s{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.aiscore .bar{height:6px;border-radius:3px;background:#EDF1F5;margin-top:6px;overflow:hidden}
.aiscore .bar i{display:block;height:100%;background:var(--primary)}
.learngrid{display:flex;flex-wrap:wrap;gap:8px 32px;margin-top:6px}
.learnitem .k{font-size:12px;color:var(--muted)}
.learnitem .v{font-size:15px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
details.fold{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);margin-bottom:20px}
details.fold summary{cursor:pointer;list-style:none;padding:14px 20px;font-weight:700;color:var(--navy);font-size:15px;display:flex;align-items:center;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"▶";font-size:11px;color:var(--muted);transition:transform .15s}
details.fold[open] summary::before{transform:rotate(90deg)}
details.fold .inner{padding:0 20px 18px}
.insight{white-space:pre-wrap;font-size:13.5px;color:var(--text);background:#F8FBFE;border-radius:var(--radius-s);padding:14px 16px;max-height:220px;overflow-y:auto}

/* ===== input ===== */
.pilltabs{display:flex;gap:8px;margin-bottom:16px}
.pill{height:40px;padding:0 20px;border-radius:20px;font-size:14px;font-weight:700;color:var(--muted);background:#fff;border:1.5px solid var(--line)}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill .cnt{margin-left:6px;font-size:12px;opacity:.8}
.inputfoot{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.dirtydot{color:var(--warn-fg);font-size:13px;font-weight:700}

/* ===== modal ===== */
.modalback{position:fixed;inset:0;background:rgba(15,42,71,.45);display:none;align-items:center;justify-content:center;z-index:90}
.modalback.on{display:flex}
.modal{width:480px;background:#fff;border-radius:var(--radius);padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:16px;color:var(--navy);margin-bottom:10px}
.modal p{font-size:14px;white-space:pre-wrap;margin-bottom:20px;color:var(--text)}
.modal .btns{display:flex;justify-content:flex-end;gap:10px}

/* empty state */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .charbox{display:block;margin:0 auto 10px}
.empty .t{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px}
.empty .d{font-size:13px;margin-bottom:14px}

.viewtitle{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.viewtitle h1{font-size:22px;color:var(--navy);font-weight:800;font-feature-settings:"palt"}
.viewtitle .vsub{font-size:13px;color:var(--muted)}
.secgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.secgrid{grid-template-columns:1fr}.kpirow{grid-template-columns:repeat(2,1fr)}.aiscores{grid-template-columns:repeat(2,1fr)}.frow{grid-template-columns:280px minmax(200px,300px);grid-auto-flow:row}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 19l6-9 4 4 8-11" stroke="#00A0E9" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="ttl">クライアント別売上予測</div>
  <a class="book" id="bookLink" target="_blank" rel="noopener">スプレッドシートで開く</a>
  <a class="book" id="auditLink" target="_blank" rel="noopener" style="display:none">操作の記録</a>
  <div class="spacer"></div>
  <div class="meta" id="hdrClient"></div>
  <div class="meta" id="hdrUser"></div>
</div>
<div class="progressbar" id="progressbar"><i></i></div>

<div class="layout">
  <nav class="sidenav" id="sidenav"></nav>
  <main class="main" id="main"></main>
</div>

<div class="modalback" id="modalBack">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <p id="modalMsg"></p>
    <div class="btns">
      <button class="btn btn-ghost" id="modalCancel">キャンセル</button>
      <button class="btn btn-primary" id="modalOk">続行する</button>
    </div>
  </div>
</div>

<script>
window.__BOOT__ = <?!= bootJson ?>;

function fmtN(v){ return (v==null||!isFinite(v))?'—':Math.round(v).toLocaleString(); }
function fmtPct(v,d){ if(v==null||!isFinite(v))return '—'; return (v*100).toFixed(d==null?1:d)+'%'; }
function fmtScore(v){ if(v==null||!isFinite(v))return '—'; return (v>0?'+':'')+Number(v).toFixed(1); }

/* ================= 空模様（表示だけの判定） =================
 * 既存の検証データ（B-2 の月別誤差率 compare[].ape / signedErr、B-4 の制約超過フラグ insights[]）を読むだけで、

 * （assets/characters/README.md・CHARACTER_DESIGN_STATUS.md の「表示条件」）。 */
var WX = {
  mikakunin:{name:'未確認・霧', line:'まだ、霧の中です'},
  tenpen:{name:'天変地異', line:'め、目が回る〜！'},
  taifuu:{name:'台風', line:'わわわ、荒れてきたぁ！'},

};
var WX_FLAGS = [['annualBreach','年間'],['halfBreach','半期'],['overBreach','過大'],['rangeBreach','範囲外']];
var WX_MIN_MONTHS = 3, WX_TENPEN_APE = 1.5, WX_TAIFUU_APE = 0.3;
/** 予測と実績がそろった月（月順）。upto を渡すとその月まで。 */
function wxEvalMonths(ev, upto){
  var rows=((ev&&ev.compare)||[]).filter(function(c){
    return (c.p50!=null||c.forecastTotal!=null) && c.actualTotal!=null && c.ape!=null && isFinite(c.ape) && (!upto||c.month<=upto);
  });
  return rows.sort(function(a,b){ return a.month<b.month?-1:(a.month>b.month?1:0); });
}
/** 最新月（upto を渡すとその月）の空模様 {id, month, reason, flags}。 */
function forecastWeather(ev, upto){
  var rows=wxEvalMonths(ev, upto);
  if(!ev||!ev.hasActuals||!rows.length) return {id:'mikakunin', month:'', flags:null, reason:'実績がまだ取り込まれていません。'};
  var last=rows[rows.length-1];
  var out=function(id, reason, flags){ return {id:id, month:last.month, reason:reason, flags:flags||null}; };
  if(rows.length<WX_MIN_MONTHS) return out('mikakunin', '実績のある月が '+rows.length+' か月です（'+WX_MIN_MONTHS+' か月そろうと判定できます）。');
  var ins=((ev.insights)||[]).filter(function(r){ return r.month===last.month; })[0];
  if(!ins) return out('mikakunin', '検証インサイト（B-4）がまだありません。');
  var flags=WX_FLAGS.filter(function(f){ return !!ins[f[0]]; }).map(function(f){ return f[1]; });
  if(last.ape>=WX_TENPEN_APE) return out('tenpen', last.month+' の誤差率が '+fmtPct(last.ape,0)+' です（150% 以上のまれな外れ）。', flags);
  var r3=rows.slice(-3);
  var signs=r3.map(function(c){ return c.signedErr>0?1:(c.signedErr<0?-1:0); }).filter(function(x){ return x!==0; });
  var flip=signs.some(function(x,i){ return i>0 && x!==signs[i-1]; });
  var big=r3.filter(function(c){ return c.ape>=WX_TAIFUU_APE; }).length;
  if(flip&&big>=2) return out('taifuu', '直近 3 か月で上振れと下振れが入れ替わり、誤差率 30% 以上が '+big+' か月あります。', flags);
  if(ins.overBreach) return out('sekka', '過大予測（予測が実績を上回る）の制約を超えています。', flags);
  if(flags.length>=2) return out('ame', '制約を '+flags.length+' つ超えています（'+flags.join('・')+'）。', flags);
  if(flags.length===1) return out('kumori', flags[0]+'の制約を 1 つ超えています。', flags);
  if(r3[2].ape>r3[1].ape && r3[1].ape>r3[0].ape) return out('harenochi', '制約の超過はありませんが、誤差率が 2 か月続けて悪化しています。', flags);
  return out('kaisei', '制約の超過はありません。', flags);
}
/** 1 か月前（予測と実績がそろった前の月）からの空模様の変化。変わっていなければ null。 */
function wxChange(ev){
  var rows=wxEvalMonths(ev);
  if(rows.length<2) return null;
  var now=forecastWeather(ev), prev=forecastWeather(ev, rows[rows.length-2].month);
  return (now.id!=='mikakunin' && prev.id!==now.id) ? {from:prev, to:now} : null;
}

/* ================= RPC ================= */
function rpc(fn, args, opts){
  opts = opts || {};
  if(state.busy) return;
  state.busy = true;
  document.getElementById('progressbar').classList.add('on');
  busyChar(true);
  if(opts.btn){ opts.btn.disabled = true; }
  var runner = google.script.run
    .withSuccessHandler(function(res){
      state.busy=false; document.getElementById('progressbar').classList.remove('on'); busyChar(false);
      if(res && res.boot){ B = res.boot; }
      if(res && res.needConfirm){ openConfirm(res.needConfirm); return; }
      if(opts.onOk) opts.onOk(res);
      if(opts.rerender!==false) render();
    })
    .withFailureHandler(function(err){
      state.busy=false; document.getElementById('progressbar').classList.remove('on'); busyChar(false);
      var msg = (err && err.message) ? err.message : String(err);
      if(opts.onErr){ opts.onErr(msg); } else { showToast(msg, true); }
      render();
    });
  runner = runner[fn];
  runner.apply(google.script.run, args || []);
}
function openConfirm(c){
  var mb=document.getElementById('modalBack');
  document.getElementById('modalTitle').textContent=c.title||'確認';
  document.getElementById('modalMsg').textContent=c.message||'';
  mb.classList.add('on');
  document.getElementById('modalOk').focus();
  document.getElementById('modalOk').onclick=function(){
    mb.classList.remove('on');
    if(state.confirms.indexOf(c.key)<0)state.confirms.push(c.key);
    rpc('webRunForecast',[state.confirms]);
  };
  document.getElementById('modalCancel').onclick=function(){ mb.classList.remove('on'); };
}
var toastTimer=null;
function showToast(msg, isErr){
  var el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite'); el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:700;z-index:95;box-shadow:0 8px 30px rgba(0,0,0,.18)'; document.body.appendChild(el); }
  // 完了の通知には よみ（確認完了）を添える。エラーは文字だけ
  el.innerHTML=(isErr?'':'<span class="toastchar">'+YOMI_POSE.done+'</span>')+'<span>'+esc(msg)+'</span>';
  el.style.padding=isErr?'12px 22px':'8px 22px 8px 12px';
  el.style.background = isErr?'var(--error)':'var(--navy)';
  el.style.color='#fff'; el.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .4s'; }, 3800);
}

// 工程リストの1行（全行同一グリッド）: [accent][badge] タイトル ⓘ …… [状態chip 96px] [メタ 200px] [ボタン 156px]
// メリハリ: 完了=ゴーストボタン（再実行は副次）、未実行/要対応=プライマリ＋青アクセントバー、エラー=赤アクセント＋エラーメタ
function stepRow(menu, ttl, desc, stepKey, btnId, btnLabel, btnDisabled){
  var st = stepKey ? stepOf(stepKey) : null;
  var stt = st ? st.status : 'not_run';
  var chip = chipFor(stt);
  var cls = stt==='error' ? ' st-err' : (stt==='success' ? ' st-ok' : ' st-pend');
  var meta = '';
  if(stt==='success') meta='<span class="s-meta">最終 '+esc(st.date)+'・'+fmtN(st.count||0)+'件</span>';
  else if(stt==='error') meta='<span class="s-meta s-err" title="'+esc(st.error||'')+'">'+esc(st.error||'エラー')+'</span>';
  else meta='<span class="s-meta"></span>';
  var btnCls = stt==='success' ? 'btn-ghost' : 'btn-primary';
  return '<div class="stepitem'+cls+'"><span class="s-badge chip chip-navy">'+menu+'</span>'
    +'<span class="s-ttl">'+esc(ttl)+'</span>'+(desc?help(desc):'')
    +'<span class="s-chip">'+chip+'</span>'+meta
    +'<button class="btn '+btnCls+'" id="'+btnId+'"'+(btnDisabled?' disabled':'')+'>'+esc(btnLabel)+'</button></div>';
}

function selHtml(cls, opts, cur, extra){

function inputCell(kind, c, r, i){

  if(c.type==='products') return selHtml('in-'+c.k+'-'+i, [''].concat(B.products), v, 'data-i="'+i+'" data-k="'+c.k+'"');
  if(c.type==='month') return selHtml('in-'+c.k+'-'+i, [''].concat(B.months), v, 'data-i="'+i+'" data-k="'+c.k+'"');
  if(c.type==='step') return selHtml('in-'+c.k+'-'+i, [''].concat(B.stepOptions), v===''?'':v, 'data-i="'+i+'" data-k="'+c.k+'"');
  if(c.type==='conf') return '<input class="inp in-'+c.k+'-'+i+' num" type="number" inputmode="decimal" min="0" max="1" step="0.1" value="'+esc(v)+'" data-i="'+i+'" data-k="'+c.k+'">';

function inputRowHtml(kind, r, i){
  // サーバー保存値と異なる（or新規追加）の行は dirty 表示

  var h='<tr data-ri="'+i+'"'+(dty?' class="dirty"':'')+'>';

  h+='<td><button class="cell-del" data-del="'+i+'" title="行を削除" aria-label="行を削除">×</button></td></tr>';
  return h;

    +kpi('Upside（P90）', fmtY(p.annual.p90))
    +kpi('最終予算（合計）', p.annual.final!=null?fmtY(p.annual.final):'—')
    +'</div>';

  html+='<div class="card chartcard"><h2>月次予測（混合 P50・P10〜P90 帯）</h2><canvas id="chart"></canvas>'
    +'<div class="legend"><span><i style="background:#BFE1F7"></i>P10〜P90</span><span><i style="background:var(--primary)"></i>Baseline P50</span><span><i style="background:#8a94a6"></i>Linear回帰</span><span><i style="background:var(--navy)"></i>採用予測/実績</span></div></div>';

  if(O.composition.length){
    var c=O.composition[0];
    // 各比率の合計は1を超えることがあるため、バー幅は合計で正規化して溢れを防ぐ
    var compTot=(c.quant||0)+(c.subjective||0)+(c.ai||0)+(c.spot||0)||1;
    var cw=function(x){ return Math.round((x||0)/compTot*1000)/10; };
    html+='<div class="card"><h2>予測の構成（診断指標）</h2>'
      +'<div class="meter">'
      +'<i style="width:'+cw(c.quant)+'%;background:var(--navy)"></i>'
      +'<i style="width:'+cw(c.subjective)+'%;background:var(--primary)"></i>'
      +'<i style="width:'+cw(c.ai)+'%;background:#7FB8DF"></i>'
      +'<i style="width:'+cw(c.spot)+'%;background:#C9D6E4"></i></div>'
      +'<div class="meterrow"><span>定量（トレンド）</span><span></span><span class="v">'+fmtPct(c.quant)+'</span></div>'
      +'<div class="meterrow"><span>主観オーバーレイ</span><span></span><span class="v">'+fmtPct(c.subjective)+'</span></div>'
      +'<div class="meterrow"><span>AI寄与</span><span></span><span class="v">'+fmtPct(c.ai)+'</span></div>'
      +'<div class="meterrow"><span>Known Spot</span><span></span><span class="v">'+fmtPct(c.spot)+'</span></div>'
      +(c.warn?'<div class="warnbox" style="margin-top:8px">'+esc(c.warn)+'</div>':'')
      +'</div>';
  }

  // 学習パラメータが効いているときだけ、適用中の係数を見せる（未学習では何も出さない）
  var L=B.learning||{};
  var mbKeys=Object.keys(L.monthBias||{}).map(Number).sort(function(a,b){return a-b;});
  var hasLearned=Math.abs((L.biasFactor||1)-1)>1e-9||mbKeys.length>0||(L.vertex&&L.vertex.hasLog)||(L.reliabilityNonDefault||0)>0;
  if(hasLearned){
    var ldets=[];
    if(mbKeys.length) ldets.push('<div class="learnitem"><div class="k">暦月バイアス</div><div class="v">'+mbKeys.map(function(m){var b=L.monthBias[m];return m+'月 '+(b>0?'+':'')+(b*100).toFixed(1)+'%';}).join('　')+'</div></div>');
    if(L.vertex&&L.vertex.hasLog) ldets.push('<div class="learnitem"><div class="k">Vertexアシスト</div><div class="v">confidence '+(L.vertex.confidence||0).toFixed(2)+'（'+esc(L.vertex.at)+' 取得 / 信頼度 '+(L.vertexReliability||1).toFixed(2)+'）</div></div>');
    if((L.reliabilityNonDefault||0)>0) ldets.push('<div class="learnitem"><div class="k">ソース信頼度</div><div class="v">'+L.reliabilityNonDefault+'件に重み適用中</div></div>');
    html+='<div class="card"><div class="h2row"><h2>学習パラメータ（この予測へ自動適用）</h2>'+help('B-5 のベイズ学習で更新された係数です。全体補正係数と暦月バイアスが予測値へ自動で掛かります。')+'</div>'
      +'<div class="learngrid"><div class="learnitem"><div class="k">全体補正係数</div><div class="v">×'+(L.biasFactor||1).toFixed(3)+'</div></div></div>'
      +(ldets.length?'<details class="fold" style="margin-top:12px"><summary>係数の内訳</summary><div class="inner"><div class="learngrid" style="margin-top:0">'+ldets.join('')+'</div></div></details>':'')
      +'</div>';
  }

  // 月次表（予算編集つき）
  html+='<div class="card"><div class="h2row"><h2>月次予測と予算策定</h2>'+help('「採用予測」「上積み」を入力すると最終予算が確定します（A-10 相当）。P10〜P90 は説明帯で、hard gate ではありません。')+'</div>'
    +'<div class="tblwrap"><table class="tbl stickyr" id="budgetTbl" style="min-width:980px">'
    +'<colgroup><col style="width:86px"><col><col><col><col><col style="width:150px"><col style="width:130px"><col></colgroup>'
    +'<thead><tr><th>月</th><th class="num">P10</th><th class="num">P50</th><th class="num">P90</th><th class="num" title="P90−P10。大きいほど不確実">幅(P90-P10)</th><th class="num" title="予算のベース予測値（P50の採用を推奨）">採用予測</th><th class="num" title="採用予測への加算額（+/-）">上積み</th><th class="num">最終予算</th></tr></thead><tbody>';
  p.monthly.forEach(function(m){
    var dirty=state.budgetDirty[m.row];
    var ad = dirty?dirty.adopted:m.adopted, up = dirty?dirty.uplift:m.uplift;
    // ドラフト中に両方空なら「予算なし」= — と表示（旧値の残像を出さない）
    var finShow;
    if(dirty){ var anyV=(ad!==''&&ad!=null)||(up!==''&&up!=null); finShow = anyV?(isFinite(Number(ad))?Number(ad):0)+(isFinite(Number(up))?Number(up):0):null; }
    else finShow=m.final;
    html+='<tr'+(dirty?' class="dirty"':'')+'><td style="font-weight:700;color:var(--navy)">'+esc(m.month)+'</td>'
      +'<td class="num">'+fmtN(m.p10)+'</td><td class="num" style="font-weight:700">'+fmtN(m.p50)+'</td><td class="num">'+fmtN(m.p90)+'</td><td class="num locked">'+fmtN(m.range)+'</td>'
      +'<td><input class="inp num" type="number" inputmode="numeric" data-brow="'+m.row+'" data-bk="adopted" value="'+(ad===''||ad==null?'':Math.round(ad))+'"></td>'
      +'<td><input class="inp num" type="number" inputmode="numeric" data-brow="'+m.row+'" data-bk="uplift" value="'+(up===''||up==null?'':Math.round(up))+'"></td>'
      +'<td class="num" style="font-weight:700" data-fin="'+m.row+'">'+(finShow==null?'—':fmtN(finShow))+'</td></tr>';
  });
  var sumFinal = p.monthly.reduce(function(a,m){var d=state.budgetDirty[m.row];var ad=d?d.adopted:m.adopted,up=d?d.uplift:m.uplift;if(d)return a+((isFinite(Number(ad))?Number(ad):0)+(isFinite(Number(up))?Number(up):0));return a+(m.final||0);},0);
  html+='<tr class="sum"><td>年度合計</td><td class="num">'+fmtN(p.annual.p10)+'</td><td class="num">'+fmtN(p.annual.p50)+'</td><td class="num">'+fmtN(p.annual.p90)+'</td><td class="num">'+fmtN(p.annual.range)+'</td><td class="num">'+fmtN(p.annual.adopted)+'</td><td class="num">'+fmtN(p.annual.uplift)+'</td><td class="num">'+fmtN(sumFinal)+'</td></tr>';
  html+='</tbody></table></div>'
    +'<div class="inputfoot"><button class="btn btn-ghost" id="btn_copyp50">P50を採用予測にコピー</button>'
    +'<button class="btn btn-primary" id="btn_savebudget">予算を保存（A-10）</button>'
    +(Object.keys(state.budgetDirty).length?'<span class="dirtydot">未保存の変更があります</span>':'')
    +'<span class="note">年度合計と月の合計が一致しないのは正常です（P10/P90 は分散で縮みます）。</span></div></div>';

  if(O.aiScores.length){
    html+='<div class="card"><h2>AI調査スコア（4軸）</h2><div class="aiscores">';
    O.aiScores.forEach(function(s){
      var pct=Math.max(4,Math.min(100,50+s.score));
      html+='<div class="aiscore"><div class="n">'+esc(s.name)+'</div><div class="s" style="color:'+(s.score<0?'var(--error)':'var(--navy)')+'">'+fmtScore(s.score)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
    });
    html+='</div>'+(O.aiScoreNote?'<div class="note" style="margin-top:10px">'+esc(O.aiScoreNote)+'</div>':'')+'</div>';
  }

  if(O.trendInsight||O.aiInsight){
    html+='<div class="secgrid">'
      +(O.trendInsight?'<details class="fold card"><summary>過去数年の数値トレンド</summary><div class="inner insight">'+esc(O.trendInsight)+'</div></details>':'')
      +(O.aiInsight?'<details class="fold card"><summary>AI調査レポート</summary><div class="inner insight">'+esc(O.aiInsight)+'</div></details>':'')
      +'</div>';
  }

  if(O.sections[1]){
    var q=O.sections[1];
    html+='<details class="fold"><summary>副次目的（客観のみ / 過去売上ベース）— 年間 P50 '+fmtY(q.annual.p50)+'</summary><div class="inner"><div class="tblwrap"><table class="tbl" style="min-width:760px">'
      +'<thead><tr><th>月</th><th class="num">P10</th><th class="num">P50</th><th class="num">P90</th><th class="num" title="Linear回帰による定量予測">回帰</th><th class="num" title="季節指数で加重した定量予測">季節加重</th></tr></thead><tbody>';
    q.monthly.forEach(function(m){ html+='<tr><td>'+esc(m.month)+'</td><td class="num">'+fmtN(m.p10)+'</td><td class="num" style="font-weight:700">'+fmtN(m.p50)+'</td><td class="num">'+fmtN(m.p90)+'</td><td class="num">'+fmtN(m.reg)+'</td><td class="num">'+fmtN(m.seasonal)+'</td></tr>'; });
    html+='</tbody></table></div></div></details>';
  }

  if(O.breakdown.length){
    html+='<details class="fold"><summary>内訳とメモ（P50 比較・定量/混合の差分）</summary><div class="inner"><div class="tblwrap"><table class="tbl" style="min-width:1080px">'
      +'<thead><tr><th>月</th><th class="num" title="確定済みの当月実績">実績確定</th><th>ソース</th><th class="num" title="定量のみの予測P50">Ops P50(定量)</th><th class="num" title="定量×定性の混合予測P50">Ops P50(混合)</th><th class="num" title="実績に含まれるスポット推計">背景SPOT</th><th class="num" title="A-8で登録済みのスポット案件分">known spot</th><th class="num" title="実績 − 予測P50(混合)">差分</th><th>OPINIONS要約</th></tr></thead><tbody>';
    O.breakdown.forEach(function(b){
      html+='<tr><td>'+esc(b.month)+'</td><td class="num">'+(b.actualClosed!=null?fmtN(b.actualClosed):'—')+'</td><td class="locked">'+esc(b.source)+'</td><td class="num">'+fmtN(b.opsQuant)+'</td><td class="num">'+fmtN(b.opsMixed)+'</td><td class="num">'+fmtN(b.bgSpot)+'</td><td class="num">'+fmtN(b.knownSpot)+'</td><td class="num">'+fmtN(b.diff)+'</td><td class="locked">'+esc(b.opinions)+'</td></tr>';
    });
    html+='</tbody></table></div></div></details>';
  }

  if(O.engineNote) html+='<div class="note" style="margin-bottom:24px">'+esc(O.engineNote).replace(/\n/g,'<br>')+'</div>';
  return html;
}
function kpi(lbl,val){ return '<div class="kpi"><div class="lbl">'+esc(lbl)+'</div><div class="val">'+esc(val)+'</div></div>'; }

/* ---------- eval ---------- */
function renderEval(){
  var html=viewTitle('検証', 'B-1 実績取込 → B-2 レポート → B-3 ダッシュボード → B-4 インサイト → B-5 自動学習');
  html+='<div class="errstrip" id="err_eval"></div>';
  html+=wxCardHtml(forecastWeather(B.eval));
  html+='<div class="card"><h2>検証工程</h2><div class="steplist">'
    + stepRow('B-1','検証実績取り込み','外部の実績集計から検証用実績を取り込みます（A-2 と同じソース）。','step2_status','btn_b1','取り込み実行')
    + stepRow('B-2','検証レポート更新','予測と実績を突合し、月次の誤差・内訳を更新します。','step5_status','btn_b2','レポート更新')
    + stepRow('B-3','ダッシュボード更新','年間制約・半期 WAPE・過大率の判定を集計します。','step6_status','btn_b3','集計を実行')
    + stepRow('B-4','学習インサイト','誤差の大きい月に原因記入欄付きのインサイト行を生成します。','step7_status','btn_b4','インサイト生成')
    +'</div></div>';

  var L=B.learning||{};
  var mb=L.monthBias||{};
  var mbKeys2=Object.keys(mb).map(Number).sort(function(a,b){return a-b;});
  var mbText=mbKeys2.length?mbKeys2.map(function(m){var b=mb[m];return m+'月 '+(b>0?'+':'')+(b*100).toFixed(1)+'%';}).join('　'):'なし';
  var vtx=L.vertex||{};
  var vtxText=!vtx.enabled?'無効（設定で有効化できます）':(vtx.hasLog?('取得済 '+esc(vtx.at)+' / confidence '+(vtx.confidence||0).toFixed(2)):'有効・未取得（A-4 または右のボタンで生成）');
  var sLearn=stepOf('learn_status');
  html+='<div class="card"><div class="h2row"><h2>自動学習（B-5）</h2>'+help('中立シナリオの予実誤差から全体補正係数と暦月別バイアスをベイズ更新します。B-2 実行後にも自動で走り、次回 A-9 予測へ反映されます。Vertexアシストは設定で有効化できます。')+'</div>'
    +'<div class="kpirow">'
    +kpi('全体補正係数','×'+(L.biasFactor||1).toFixed(3))
    +kpi('暦月バイアス', mbKeys2.length?('学習済み '+mbKeys2.length+' 暦月'):'未学習')
    +kpi('Vertexアシスト', vtx.enabled?('weight '+(L.vertexWeight||0.5).toFixed(2)+' × 信頼度 '+(L.vertexReliability||1).toFixed(2)):'無効')
    +kpi('自動更新', L.autoUpdate?'ON':'OFF')
    +'</div>'
    +'<details class="fold"><summary>学習の詳細</summary><div class="inner">'
    +'<div class="tblwrap"><table class="tbl" style="min-width:560px"><colgroup><col style="width:200px"><col></colgroup><tbody>'
    +'<tr><td>暦月別バイアス</td><td>'+mbText+'</td></tr>'
    +'<tr><td>Vertexアシスト</td><td>'+vtxText+'</td></tr>'
    +'<tr><td>ソース信頼度の学習</td><td>'+((L.reliabilityNonDefault||0)>0?L.reliabilityNonDefault+'件のソースに重み適用中':'デフォルト（全ソース×1.0）')+(L.lastAppliedQuarter?('（四半期適用 '+esc(L.lastAppliedQuarter)+'）'):'（C-2 未適用）')+'</td></tr>'
    +'</tbody></table></div></div></details>'
    +'<div class="inputfoot"><button class="btn btn-primary" id="btn_b5">自動学習を実行（B-5）</button>'

    +'<button class="btn btn-ghost" id="btn_backtest">学習効果を検算</button>'

  if(state.backtest){

        +'<div class="tblwrap"><table class="tbl" style="min-width:720px"><thead><tr><th>月</th><th class="num">学習係数</th><th class="num" title="当月の暦月バイアス">暦月バイアス</th><th class="num">誤差（補正なし）</th><th class="num">誤差（補正あり）</th></tr></thead><tbody>';
      bt.months.forEach(function(m){
        html+='<tr><td>'+esc(m.ym)+'</td><td class="num">×'+m.factor.toFixed(3)+'</td><td class="num">'+fmtPct(m.monthBias)+'</td><td class="num">'+fmtN(m.errBefore)+'</td><td class="num"'+(m.errAfter>m.errBefore?' style="color:var(--error)"':'')+'>'+fmtN(m.errAfter)+'</td></tr>';
      });
      html+='</tbody></table></div><div class="note" style="margin-top:10px">'+esc(bt.note||'')+'</div>';
    }
    html+='</div>';
  }

  if(B.eval.metrics.length){
    html+='<div class="card"><h2>精度KPI（DASHBOARD）</h2><div class="tblwrap"><table class="tbl" style="min-width:620px"><colgroup><col style="width:280px"><col style="width:180px"><col></colgroup><thead><tr><th>指標</th><th class="num">値</th><th>判定 / 備考</th></tr></thead><tbody>';

        +'<div class="legend"><span><i style="background:var(--primary)"></i>誤差率</span><span><i style="background:var(--warn-fg)"></i>P10〜P90外</span><span><i style="background:#8a94a6"></i>30% 基準線</span></div>'
        +'<div class="tblwrap tblscroll" style="margin-top:14px"><table class="tbl" style="min-width:840px"><colgroup><col style="width:86px"><col><col><col><col style="width:80px"><col style="width:128px"><col style="width:110px"></colgroup><thead><tr><th>月</th><th class="num">予測(P50)</th><th class="num">実績</th><th class="num" title="実績 − 予測P50">差分</th><th class="num" title="|実績−予測| ÷ 実績（APE）">誤差率</th><th title="実績がP10〜P90の帯の外側に出た月">範囲外</th><th>期</th></tr></thead><tbody>';
      withFc.forEach(function(c){
        html+='<tr><td style="font-weight:700;color:var(--navy)">'+esc(c.month)+'</td><td class="num">'+fmtN(c.p50!=null?c.p50:c.forecastTotal)+'</td><td class="num">'+fmtN(c.actualTotal)+'</td><td class="num"'+(c.gap<0?' style="color:var(--error)"':'')+'>'+fmtN(c.gap)+'</td><td class="num">'+fmtPct(c.ape)+'</td><td>'+(c.rangeOutside?'<span class="chip chip-warn">P10-90外</span>':'')+'</td><td class="locked">'+esc(c.half||c.quarter)+'</td></tr>';

      +'<colgroup><col style="width:80px"><col style="width:130px"><col style="width:130px"><col style="width:90px"><col style="width:160px"><col style="width:170px"><col style="width:130px"><col style="width:110px"><col style="width:110px"></colgroup>'
      +'<thead><tr><th>月</th><th class="num">予測P50</th><th class="num">実績</th><th class="num" title="|実績−予測| ÷ 実績（APE）">誤差率</th><th>インサイト</th><th>原因仮説</th><th title="次サイクルへの対応方針">対応種別</th><th>担当</th><th>状態</th></tr></thead><tbody>';

/* ================= chart ================= */
function drawApeChart(){
  var cv=document.getElementById('apechart'); if(!cv)return;
  var rows=(B.eval.compare||[]).filter(function(c){return (c.p50!=null)||(c.forecastTotal!=null);});
  if(!rows.length)return;
  var W=cv.clientWidth||1100, H=190, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr;
  var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  var padL=52, padR=12, padT=14, padB=30;
  var CAP=1.5; // 表示上限150%（外れ値で他バーが潰れないよう頭打ち。実値はラベル表示）
  var max=Math.max(0.35, Math.min(CAP, Math.max.apply(null, rows.map(function(c){return Math.min(c.ape||0,CAP);}))));
  max*=1.15;
  var X=function(i){ return padL+(W-padL-padR)*(i+0.5)/rows.length; };
  var bw=Math.max(8,Math.min(44,(W-padL-padR)/rows.length*0.56));
  var Y=function(v){ return padT+(H-padT-padB)*(1-v/max); };
  // グリッド + Y軸ラベル
  ctx.font='12px sans-serif'; ctx.lineWidth=1; ctx.strokeStyle='#EAF0F6'; ctx.fillStyle='#5A6B7E';
  for(var g=0;g<=4;g++){ var yv=max*g/4, y=Y(yv); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.textAlign='right'; ctx.fillText(Math.round(yv*100)+'%', padL-8, y+4); }
  // 30% 基準線
  ctx.setLineDash([5,4]); ctx.strokeStyle='#8a94a6'; ctx.beginPath();
  var y30=Y(0.30); ctx.moveTo(padL,y30); ctx.lineTo(W-padR,y30); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#5A6B7E'; ctx.textAlign='right'; ctx.font='11px sans-serif';
  ctx.fillText('30%', W-padR-2, y30-4);
  // バー（150%超は頭打ち + 実値ラベル）
  rows.forEach(function(c,i){
    var raw=c.ape||0, a=Math.max(0.004, Math.min(raw,CAP)), x=X(i)-bw/2, y=Y(a);
    ctx.fillStyle=c.rangeOutside?'#A65C00':'#00A0E9';
    ctx.fillRect(x, y, bw, (H-padB)-y);
    if(raw>CAP){ ctx.fillStyle='#A65C00'; ctx.textAlign='center'; ctx.font='700 11px sans-serif';
      var lx=Math.max(padL+26, Math.min(W-padR-26, X(i)));
      ctx.fillText(Math.round(raw*100)+'%', lx, Math.max(padT+8, y-3)); }
    ctx.fillStyle='#5A6B7E'; ctx.textAlign='center'; ctx.font='12px sans-serif';
    ctx.fillText(String(c.month).replace(/^20/,''), X(i), H-padB+16);
  });
}

function drawChart(anim){
  var cv=document.getElementById('chart'); if(!cv||!B.output)return;
  var p=B.output.sections[0];
  var W=cv.clientWidth||1100, H=360;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr;
  var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  var padL=76,padR=20,padT=18,padB=34;
  var ms=p.monthly; if(!ms.length)return;
  var max=0; ms.forEach(function(m){max=Math.max(max,m.p90||0,m.p50||0,m.adopted||0);});
  max*=1.06;
  if(!isFinite(max)||max<=0)max=1; // 全値0・欠損でも描画を破壊しない
  var X=function(i){return ms.length>1?padL+(W-padL-padR)*(i/(ms.length-1)):padL+(W-padL-padR)/2;};
  var Y=function(v){return padT+(H-padT-padB)*(1-v/max);};
  var t = anim ? Math.min(1, anim.t||0) : 1;
  // grid
  ctx.strokeStyle='#EAF0F6'; ctx.fillStyle='#5A6B7E'; ctx.font='12px sans-serif'; ctx.lineWidth=1;
  for(var g=0;g<=4;g++){ var yv=max*g/4, y=Y(yv); ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    ctx.textAlign='right'; ctx.fillText(fmtY(yv), padL-8, y+4); }
  // band
  ctx.beginPath();
  ms.forEach(function(m,i){ var x=X(i); i?ctx.lineTo(x,Y(m.p90)):ctx.moveTo(x,Y(m.p90)); });
  for(var i=ms.length-1;i>=0;i--){ ctx.lineTo(X(i),Y(ms[i].p10)); }
  ctx.closePath(); ctx.fillStyle='rgba(0,160,233,.14)'; ctx.fill();
  // reg dashed
  ctx.setLineDash([5,4]); ctx.strokeStyle='#8a94a6'; ctx.lineWidth=1.6; ctx.beginPath();
  ms.forEach(function(m,i){ var x=X(i), y=Y(m.reg); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); ctx.setLineDash([]);
  // p50 line (animated)
  ctx.strokeStyle='#00A0E9'; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.beginPath();
  var n=Math.min(ms.length,Math.max(2,Math.ceil(ms.length*t)));
  for(var i2=0;i2<n;i2++){ var m2=ms[i2]; i2?ctx.lineTo(X(i2),Y(m2.p50)):ctx.moveTo(X(i2),Y(m2.p50)); }
  ctx.stroke();
  // adopted
  var hasAdopted=ms.some(function(m){return m.adopted!=null;});
  if(hasAdopted){
    ctx.strokeStyle='#0F3557'; ctx.lineWidth=2; ctx.setLineDash([2,3]); ctx.beginPath();
    ms.forEach(function(m,i){ if(m.adopted==null)return; var x=X(i),y=Y(m.adopted); ctx.lineTo(x,y); });
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#0F3557';
    ms.forEach(function(m,i){ if(m.adopted==null)return; ctx.beginPath();ctx.arc(X(i),Y(m.adopted),3,0,7);ctx.fill(); });
  }
  // actual closed dots
  var bd=B.output.breakdown||[];
  ctx.fillStyle='#0B2A47';
  bd.forEach(function(b,i){ if(b.actualClosed==null)return; ctx.beginPath();ctx.arc(X(i),Y(b.actualClosed),4,0,7);ctx.fill(); });
  // x labels (幅に応じて間引き、衝突しない間隔にする)
  ctx.fillStyle='#5A6B7E'; ctx.textAlign='center';
  var stride=Math.max(1,Math.ceil(ms.length/(Math.floor((W-padL-padR)/56)||1)));
  var lastLX=-1e9;
  ms.forEach(function(m,i){ var x=X(i); if(i%stride===0||i===ms.length-1){ if(x-lastLX>=56){ ctx.fillText(m.month, x, H-padB+18); lastLX=x; } }});
  if(anim&&t<1){ anim.t=t+0.08; requestAnimationFrame(function(){drawChart(anim);}); }
}

      if(Object.keys(state.decisionDirty).length){ showToast('先に「承認を保存」を実行してください',true); return; }
      rpc('webApplyQuarterly',[],{btn:e.target,onOk:function(r){
        if(r.quarterly)B.quarterly=r.quarterly;
        var a=r.result||{};
        showToast('適用しました（承認 '+a.applied+' / 却下 '+a.rejected+' / 保留 '+a.hold+'）');
      }});
    };
  }
}
function fillClientSelect(){
  var sel=document.getElementById('set_client'); if(!sel)return;
  var cur=B.setup.client;
  var opts=(state.candidates&&state.candidates.length?state.candidates:(cur?[cur]:[])).slice();
  if(cur&&opts.indexOf(cur)<0)opts.unshift(cur);
  sel.innerHTML=opts.map(function(o){return '<option value="'+esc(o)+'"'+(o===cur?' selected':'')+'>'+esc(o)+'</option>';}).join('') || '<option value="">（候補なし）</option>';
}
function markDirty(){
  // 再描画せず未保存ドットとタブの*印だけを足す（入力フォーカスを保持するため）
  var foot=document.querySelector('.inputfoot');
  if(foot && !foot.querySelector('.dirtydot')){
    var d=document.createElement('span'); d.className='dirtydot'; d.textContent='未保存の変更があります';
    foot.insertBefore(d, foot.querySelector('.note'));
  }
  if(state.view==='input'){
    var p=document.querySelector('.pill.on');
    if(p && p.textContent.slice(-2)!==' *') p.appendChild(document.createTextNode(' *'));
  }
}
function setErr(id,msg){ var el=document.getElementById(id); if(el){el.textContent=msg;el.classList.add('on');} else showToast(msg,true); }

/* ================= boot ================= */
(function(){
  var h=(location.hash||'').replace('#','');
  if(['home','prep','input','forecast','eval','quarterly'].indexOf(h)>=0)state.view=h;
  window.addEventListener('hashchange',function(){
    var v=(location.hash||'').replace('#','');
    if(v!==state.view){state.view=v;render();}
  });
  // インサイト(data-irow/ik)・四半期承認(data-qrow)の変更は#mainに1回だけ委譲する
  document.getElementById('main').addEventListener('change',function(ev){
    var irow=Number(ev.target.getAttribute('data-irow')), ik=ev.target.getAttribute('data-ik');
    if(irow && ik){ var d=state.insightDirty[irow]||(state.insightDirty[irow]={}); d[ik]=ev.target.value; var itr=ev.target.closest('tr'); if(itr)itr.classList.add('dirty'); markDirty(); return; }
    var qrow=Number(ev.target.getAttribute('data-qrow'));
    if(qrow){ state.decisionDirty[qrow]=ev.target.value; var qtr=ev.target.closest('tr'); if(qtr)qtr.classList.add('dirty'); markDirty(); }
  });
  // ⓘポップオーバー: 外側クリックで全て閉じる
  document.addEventListener('click',function(ev){
    if(!ev.target.closest('.qh')) document.querySelectorAll('details.qh[open]').forEach(function(d){d.open=false;});
  });
  // モーダル: 背景クリック / Esc で閉じる
  var mb=document.getElementById('modalBack');
  mb.addEventListener('click',function(ev){ if(ev.target===mb)mb.classList.remove('on'); });
  document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'&&mb.classList.contains('on'))mb.classList.remove('on'); });
  var rzT=null;
  window.addEventListener('resize',function(){
    clearTimeout(rzT);
    rzT=setTimeout(function(){ if(state.view==='forecast') drawChart(); if(state.view==='eval') drawApeChart(); },160);
  });
  render();
})();
</script>
</body>
