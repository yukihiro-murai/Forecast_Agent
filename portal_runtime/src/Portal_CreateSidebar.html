<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --blue:#1a73e8; --dark:#202124; --muted:#5f6368; --line:#dadce0; --soft:#f8f9fa; --warn:#fef7e0; --bad:#fce8e6; --good:#e6f4ea; }
    * { box-sizing: border-box; }
    body { margin:0; padding:18px; font:14px/1.5 Arial,sans-serif; color:var(--dark); }
    h1 { font-size:19px; margin:0 0 6px; }
    .lead { color:var(--muted); margin:0 0 18px; }
    label { display:block; font-weight:bold; margin:14px 0 5px; }
    .required::after { content:' 必須'; color:#b3261e; font-size:11px; font-weight:normal; }
    input, select, textarea { width:100%; border:1px solid var(--line); border-radius:6px; padding:9px 10px; font:inherit; background:#fff; }
    textarea { min-height:70px; resize:vertical; }
    input:focus, select:focus, textarea:focus { outline:2px solid #d2e3fc; border-color:var(--blue); }
    .hint { color:var(--muted); font-size:12px; margin-top:4px; }
    .actions { display:flex; gap:8px; margin-top:18px; }
    button { border:0; border-radius:6px; padding:10px 13px; font-weight:bold; cursor:pointer; }
    button.primary { background:var(--blue); color:#fff; flex:1; }
    button.secondary { background:#e8f0fe; color:#174ea6; flex:1; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .panel { margin-top:16px; padding:12px; border-radius:8px; background:var(--soft); }
    .panel.good { background:var(--good); }
    .panel.warn { background:var(--warn); }
    .panel.bad { background:var(--bad); }
    .candidate { margin-top:9px; padding-top:9px; border-top:1px solid rgba(0,0,0,.12); }
    .candidate:first-of-type { border-top:0; }
    .candidate a { color:var(--blue); font-weight:bold; }
    .check { display:flex; align-items:flex-start; gap:8px; margin-top:12px; font-weight:normal; }
    .check input { width:auto; margin-top:4px; }
    .hidden { display:none; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid #c5c5c5; border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <h1>新しい年度計画を作る</h1>
  <p class="lead" id="lead">既存の計画を確認してから、作成を依頼します。</p>

  <form id="form" autocomplete="off">
    <label class="required" for="fiscalYear">対象年度</label>
    <select id="fiscalYear" required></select>
    <div class="hint">年度は4月から翌年3月です。</div>

    <label class="required" for="clientName">クライアント名</label>
    <input id="clientName" maxlength="120" placeholder="例：MSD株式会社" required>

    <label for="clientId">クライアントID（わかる場合だけ）</label>
    <input id="clientId" maxlength="100" placeholder="社内で使用しているID">
    <div class="hint">空欄でも依頼できます。後で正式IDと結び付けられます。</div>

    <label class="required" for="forecastOwnerEmail">Forecast Owner</label>
    <input id="forecastOwnerEmail" type="email" maxlength="254" required>
    <div class="hint">アクセス制限ではなく、計画案をまとめて提出する担当者です。</div>

    <label for="relatedMembersText">関与メンバー（任意）</label>
    <textarea id="relatedMembersText" placeholder="メールアドレスを改行またはカンマで区切って入力"></textarea>
    <div class="hint">複数クライアントへ関与する人も自由に追加できます。後から変更できます。</div>

    <div class="actions">
      <button class="secondary" type="button" id="previewButton">重複候補を確認</button>
    </div>
    <div id="result" class="hidden" role="status" aria-live="polite"></div>
    <label id="similarConfirmWrap" class="check hidden">
      <input type="checkbox" id="confirmSimilarDuplicates">
      <span>表示された候補とは別のクライアントです。</span>
    </label>
    <div class="actions">
      <button class="primary" type="button" id="submitButton" disabled>このクライアントの作成を依頼</button>
    </div>
  </form>

  <script>
    'use strict';
    var latestPreview = null;
    var busy = false;
    var ids = ['fiscalYear','clientName','clientId','forecastOwnerEmail','relatedMembersText'];
    var elements = {};
    ids.concat(['lead','form','result','previewButton','submitButton','confirmSimilarDuplicates','similarConfirmWrap']).forEach(function(id) {
      elements[id] = document.getElementById(id);
    });

    google.script.run.withSuccessHandler(loadModel).withFailureHandler(showFailure).vNextPortalGetCreateModel();
    elements.previewButton.addEventListener('click', preview);
    elements.submitButton.addEventListener('click', submit);
    ids.forEach(function(id) { elements[id].addEventListener('input', invalidatePreview); });
    elements.confirmSimilarDuplicates.addEventListener('change', updateSubmitState);

    function loadModel(model) {
      elements.lead.textContent = model.instructions || elements.lead.textContent;
      (model.fiscalYears || []).forEach(function(year) {
        var option = document.createElement('option');
        option.value = year;
        option.textContent = 'FY' + year;
        if (Number(year) === Number(model.defaultFiscalYear)) option.selected = true;
        elements.fiscalYear.appendChild(option);
      });
      elements.forecastOwnerEmail.value = model.defaultForecastOwnerEmail || '';
    }

    function basePayload() {
      return {
        fiscalYear: Number(elements.fiscalYear.value),
        clientName: elements.clientName.value,
        clientId: elements.clientId.value,
        forecastOwnerEmail: elements.forecastOwnerEmail.value,
        relatedMembersText: elements.relatedMembersText.value
      };
    }

    function preview() {
      if (busy || !elements.form.reportValidity()) return;
      setBusy(true, '候補を確認しています…');
      google.script.run.withSuccessHandler(function(result) {
        setBusy(false);
        latestPreview = result;
        renderPreview(result);
      }).withFailureHandler(showFailure).vNextPortalPreviewCreation(basePayload());
    }

    function submit() {
      if (busy || !latestPreview || !elements.form.reportValidity()) return;
      setBusy(true, '作成依頼を送信しています…');
      var payload = basePayload();
      payload.duplicateCheckHash = latestPreview.duplicateCheckHash;
      payload.confirmSimilarDuplicates = Boolean(elements.confirmSimilarDuplicates.checked);
      google.script.run.withSuccessHandler(function(result) {
        setBusy(false);
        elements.form.classList.add('hidden');
        clearResult('good');
        appendText(elements.result, result.message);
        var id = document.createElement('div');
        id.className = 'candidate';
        id.textContent = '受付番号：' + result.requestId;
        elements.result.appendChild(id);
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'primary';
        button.style.marginTop = '14px';
        button.textContent = 'ホームを更新して閉じる';
        button.addEventListener('click', function() {
          button.disabled = true;
          google.script.run.withSuccessHandler(function() { google.script.host.close(); })
            .withFailureHandler(showFailure).vNextPortalGoHome();
        });
        elements.result.appendChild(button);
      }).withFailureHandler(showFailure).vNextPortalSubmitCreationRequest(payload);
    }

    function renderPreview(result) {
      clearResult(result.hasExact ? 'bad' : result.hasSimilar ? 'warn' : 'good');
      appendText(elements.result, result.message);
      (result.candidates || []).forEach(function(candidate) {
        var box = document.createElement('div');
        box.className = 'candidate';
        var title = document.createElement('strong');
        title.textContent = 'FY' + candidate.fiscalYear + '　' + candidate.clientName;
        box.appendChild(title);
        var detail = document.createElement('div');
        detail.textContent = candidate.reason + '／' + candidate.status + (candidate.clientId ? '／ID: ' + candidate.clientId : '');
        box.appendChild(detail);
        if (candidate.url) {
          var link = document.createElement('a');
          link.href = candidate.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = '既存の計画を開く';
          box.appendChild(link);
        }
        elements.result.appendChild(box);
      });
      elements.similarConfirmWrap.classList.toggle('hidden', !result.hasSimilar || result.hasExact);
      elements.confirmSimilarDuplicates.checked = false;
      updateSubmitState();
    }

    function clearResult(kind) {
      elements.result.textContent = '';
      elements.result.className = 'panel ' + (kind || '');
    }

    function appendText(parent, text) {
      var node = document.createElement('div');
      node.textContent = text || '';
      parent.appendChild(node);
    }

    function invalidatePreview() {
      latestPreview = null;
      elements.result.className = 'hidden';
      elements.result.textContent = '';
      elements.similarConfirmWrap.classList.add('hidden');
      elements.confirmSimilarDuplicates.checked = false;
      elements.submitButton.disabled = true;
    }

    function updateSubmitState() {
      var canSubmit = latestPreview && latestPreview.canSubmit &&
        (!latestPreview.hasSimilar || elements.confirmSimilarDuplicates.checked);
      elements.submitButton.disabled = busy || !canSubmit;
    }

    function setBusy(value, message) {
      busy = value;
      elements.previewButton.disabled = value;
      elements.submitButton.disabled = value || !latestPreview;
      if (value) {
        clearResult('');
        var spinner = document.createElement('span');
        spinner.className = 'spinner';
        elements.result.appendChild(spinner);
        elements.result.appendChild(document.createTextNode(message || '処理中…'));
      } else {
        updateSubmitState();
      }
    }

    function showFailure(error) {
      busy = false;
      elements.previewButton.disabled = false;
      clearResult('bad');
      appendText(elements.result, error && error.message ? error.message : String(error || '処理に失敗しました。'));
      updateSubmitState();
    }
  </script>
</body>
</html>
