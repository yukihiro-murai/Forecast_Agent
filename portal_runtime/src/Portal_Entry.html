<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #F5F8FB;
      --card: #FFFFFF;
      --primary: #00A0E9;
      --navy: #004080;
      --text: #1F2A37;
      --muted: #6B7A8C;
      --line: #E3EAF2;
      --warn-bg: #FFF6E8;
      --warn-fg: #A65C00;
      --good-bg: #E8F7EF;
      --good-fg: #0F7B3A;
      --chip: #EEF5FB;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(16,42,67,.08), 0 4px 16px rgba(16,42,67,.05);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Helvetica Neue", "Yu Gothic", sans-serif;
      max-width: 720px; margin: 24px auto; padding: 0 16px 40px;
      color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.5;
    }
    h1 { color: var(--navy); font-size: 22px; font-weight: 700; margin: 0; }
    .tag { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
    .brand { margin-bottom: 18px; }
    .card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 22px; margin: 14px 0;
    }
    .hero p { margin: 8px 0 0; color: var(--muted); }
    a.btn, button {
      display: block; text-align: center; text-decoration: none; border: none;
      border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 700;
    }
    a.btn-primary, button.primary {
      background: var(--primary); color: #fff; padding: 14px 16px; font-size: 16px; margin-top: 16px;
    }
    a.btn-secondary {
      background: #fff; color: var(--navy); border: 1px solid var(--line);
      padding: 12px 16px; font-size: 14px; margin-top: 8px;
    }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .toolbar { display: flex; gap: 8px; margin: 4px 0 12px; }
    input[type=search] {
      flex: 1; height: 40px; padding: 8px 12px; border: 1px solid var(--line);
      border-radius: 8px; font: inherit; color: var(--text); background: #fff;
    }
    .section-title { color: var(--navy); font-size: 15px; font-weight: 700; margin: 0 0 4px; }
    .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
    .book {
      display: block; text-decoration: none; color: inherit;
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; margin: 8px 0; background: #fff;
    }
    .book:hover { border-color: #B3DFF6; background: #F4FBFF; }
    .book-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .book-name { font-size: 15px; font-weight: 700; color: var(--navy); }
    .book-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .chip {
      display: inline-block; border-radius: 99px; padding: 3px 10px;
      font-size: 11px; font-weight: 700; background: var(--chip); color: var(--navy);
      white-space: nowrap;
    }
    .chip.warn { background: var(--warn-bg); color: var(--warn-fg); }
    .chip.good { background: var(--good-bg); color: var(--good-fg); }
    .empty { color: var(--muted); padding: 12px 0; }
    .loading { color: var(--muted); padding: 20px 0; }
    .error { color: #C0392B; background: #FDECEC; border-radius: 8px; padding: 10px 12px; }
    .footer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
    .tiny { font-size: 12px; color: var(--muted); }
    .tiny a { color: var(--muted); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="brand">
    <h1>年度計画</h1>
    <p class="tag">クライアント別の年間売上計画</p>
  </div>

  <div id="error" class="error hidden" role="alert"></div>
  <div id="loading" class="loading">読み込んでいます…</div>

  <div id="app" class="hidden">
    <section class="card hero">
      <div class="section-title">はじめる</div>
      <p>新しい年度・クライアントの計画は、ポータルから作成します。すでにある計画は下の一覧から開けます。</p>
      <a id="portalButton" class="btn btn-primary" href="#" target="_blank" rel="noopener">年度計画ポータルを開く</a>
    </section>

    <section class="card">
      <div class="section-title">いま進んでいる計画</div>
      <p class="hint">社内の誰でも開いて状況を確認できます。</p>
      <div class="toolbar">
        <input id="search" type="search" placeholder="クライアント名で探す" aria-label="クライアント名で探す">
      </div>
      <div id="books"></div>
    </section>

    <footer class="footer">
      <p class="tiny" id="adminLine"></p>
    </footer>
  </div>

  <script>
    function chipClass(tone) {
      if (tone === 'warn') return 'chip warn';
      if (tone === 'good') return 'chip good';
      return 'chip';
    }
    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function render(model) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('portalButton').href = model.portalUrl;
      const admin = document.getElementById('adminLine');
      if (model.adminHubUrl) {
        admin.innerHTML = '<a href="' + escapeHtml(model.adminHubUrl) + '" target="_blank" rel="noopener">管理者用ハブ</a>';
      } else {
        admin.textContent = '';
      }
      const books = model.books || [];
      const box = document.getElementById('books');
      function paint(filter) {
        const q = String(filter || '').trim().toLowerCase();
        const rows = books.filter(function (book) {
          if (!q) return true;
          return String(book.clientName || '').toLowerCase().indexOf(q) >= 0 ||
            String(book.fiscalYear || '').indexOf(q) >= 0;
        });
        if (!rows.length) {
          box.innerHTML = '<div class="empty">表示できる計画はまだありません。上のボタンから作成してください。</div>';
          return;
        }
        box.innerHTML = rows.map(function (book) {
          const body =
            '<div class="book-top">' +
              '<div><div class="book-name">' + escapeHtml(book.clientName) + '</div>' +
              '<div class="book-meta">FY' + escapeHtml(book.fiscalYear) +
                (book.nextAction ? ' · ' + escapeHtml(book.nextAction) : '') + '</div></div>' +
              '<span class="' + chipClass(book.tone) + '">' + escapeHtml(book.stateLabel) + '</span>' +
            '</div>';
          if (book.url) {
            return '<a class="book" href="' + escapeHtml(book.url) + '" target="_blank" rel="noopener">' + body + '</a>';
          }
          return '<div class="book">' + body + '</div>';
        }).join('');
      }
      paint('');
      document.getElementById('search').addEventListener('input', function (event) {
        paint(event.target.value);
      });
    }
    function fail(message) {
      document.getElementById('loading').classList.add('hidden');
      const el = document.getElementById('error');
      el.textContent = message;
      el.classList.remove('hidden');
    }
    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(function (error) {
        fail(error && error.message ? error.message : '入口を表示できませんでした。社内アカウントで開き直してください。');
      })
      .vNextPortalGetEntryModel();
  </script>
</body>
</html>
