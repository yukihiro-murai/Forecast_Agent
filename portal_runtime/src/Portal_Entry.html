<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>年度予算策定</title>
  <?!= HtmlService.createHtmlOutputFromFile('Characters').getContent() ?>
  <style>
    :root {
      --bg:#F6F8FB; --card:#fff; --navy:#0F3557; --text:#24303E; --muted:#5A6B7E;
      --line:#E4E9F0; --line-strong:#D3DCE6; --primary:#00A0E9; --chip:#EEF4FA;
      --bubble-bg:#F3FAFF; --bubble-line:#CFE9FA;
      --radius:14px; --shadow:0 1px 2px rgba(15,42,71,.06), 0 8px 24px rgba(15,42,71,.06);
      --warn-bg:#FFF6E8; --warn-fg:#A65C00; --good-bg:#E8F7EF; --good-fg:#0F7B3A;
      --card-pad:28px; --stack:16px; --guide-h:72px;
      --cta-w:220px; --cta-h:48px;
    }
    * { box-sizing:border-box; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;
      max-width:880px; margin:0 auto; padding:36px 16px 72px;
      color:var(--text); font-size:18px; line-height:1.7; font-weight:400;
      overflow-wrap:break-word; -webkit-font-smoothing:antialiased;
      background:linear-gradient(180deg,#E9F3FB 0%, var(--bg) 240px);
    }
    h1 {
      font-size:28px; font-weight:600; margin:0 0 24px; color:var(--navy);
      letter-spacing:.01em;
    }
    h2 {
      font-size:20px; font-weight:600; margin:0; line-height:1.35; color:var(--navy);
      min-width:0;
    }
    #app {
      display:grid; gap:20px;
    }
    .card {
      display:grid;
      grid-template-columns:minmax(0, 1fr);
      grid-template-rows:auto auto minmax(0, auto) auto;
      align-content:start;
      background:var(--card); border-radius:var(--radius);
      padding:var(--card-pad);
      margin:0; border:1px solid var(--line); box-shadow:var(--shadow);
    }
    .card.primary-card {
      border-color:#B9DFF5;
      box-shadow:0 1px 2px rgba(0,160,233,.08), 0 10px 28px rgba(15,42,71,.08);
    }
    .card-head {
      display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px;
      margin:0 0 var(--stack);
      min-height:32px;
    }
    .layer-label {
      display:inline-flex; align-items:center; justify-content:center;
      margin:0; padding:5px 11px; flex-shrink:0;
      border:1.5px solid var(--line-strong); border-radius:6px;
      background:var(--chip); color:var(--navy);
      font-size:15px; font-weight:700; letter-spacing:.02em; line-height:1.2;
    }
    .cast {
      display:grid; grid-template-columns:var(--guide-h) minmax(0, 1fr);
      column-gap:14px; align-items:center;
      margin:0 0 var(--stack); min-height:var(--guide-h);
    }
    .bot-slot {
      display:flex; align-items:center; justify-content:center;
      width:var(--guide-h); height:var(--guide-h);
    }
    .bot { width:64px; height:64px; display:block; overflow:visible; }
    .bot svg { width:100%; height:100%; display:block; }
    .bubble {
      position:relative; min-width:0; min-height:56px;
      display:flex; align-items:center;
      background:var(--bubble-bg); color:var(--text);
      border:1.5px solid var(--bubble-line); border-radius:16px;
      padding:12px 16px; font-size:16px; font-weight:400; line-height:1.55;
    }
    .bubble::before {
      content:""; position:absolute; left:-7px; top:50%; width:12px; height:12px;
      margin-top:-6px; background:inherit;
      border-left:1.5px solid var(--bubble-line);
      border-bottom:1.5px solid var(--bubble-line);
      transform:rotate(45deg);
    }
    .bubble p { margin:0; }
    .card-body {
      display:grid; gap:12px; align-content:start;
      margin:0 0 var(--stack); min-height:0;
    }
    .card-body:empty { display:none; margin:0; }
    .card-actions {
      display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end;
      gap:12px; margin:0; padding:0;
      min-height:var(--cta-h);
    }
    .card-actions:empty {
      display:none; padding:0; min-height:0;
    }
    a.btn, button, .pick {
      font-family:inherit; font-weight:600; cursor:pointer; border:none; text-decoration:none;
    }
    a.btn-primary, button.btn-primary,
    a.btn-admin {
      display:inline-flex; align-items:center; justify-content:center;
      width:var(--cta-w); height:var(--cta-h);
      min-width:var(--cta-w); max-width:var(--cta-w);
      min-height:var(--cta-h); max-height:var(--cta-h);
      padding:0 16px; font-size:17px;
      border-radius:12px; line-height:1.2;
    }
    a.btn-primary, button.btn-primary {
      background:var(--primary); color:#fff;
      box-shadow:0 2px 10px rgba(0,160,233,.28);
    }
    a.btn-primary:hover, button.btn-primary:hover { background:#0090D6; }
    a.btn-primary[aria-disabled="true"] { opacity:.4; pointer-events:none; box-shadow:none; }
    a.btn-admin {
      background:#fff; color:var(--navy); border:1.5px solid var(--line-strong);
      box-shadow:none;
    }
    a.btn-admin:hover { background:#F4F7FA; }
    a.btn-open {
      display:inline-flex; align-items:center; justify-content:center;
      width:72px; height:40px;
      min-width:72px; max-width:72px;
      min-height:40px; max-height:40px;
      padding:0 12px; font-size:15px;
      border-radius:10px; line-height:1.2; flex-shrink:0;
      background:var(--primary); color:#fff;
    }
    a.btn-open:hover { background:#0090D6; }
    :focus { outline:none; }
    :focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
    .picks { display:flex; flex-wrap:wrap; gap:8px; margin:0; }
    .pick {
      display:inline-flex; align-items:center; justify-content:center;
      min-height:40px; min-width:104px; padding:8px 14px; border-radius:10px;
      border:1.5px solid var(--line-strong); background:#fff; color:var(--navy); font-size:15px;
    }
    .pick:hover { border-color:var(--primary); }
    .pick.selected, .pick[aria-pressed="true"] {
      background:#F5FBFF; color:var(--navy); border-color:var(--primary);
      box-shadow:inset 0 0 0 1px var(--primary);
    }
    .books { display:grid; gap:8px; }
    .book {
      display:flex; justify-content:space-between; gap:12px; align-items:center;
      text-decoration:none; color:inherit; min-height:58px;
      border:1.5px solid var(--line); border-radius:var(--radius);
      padding:12px 14px; background:#fff;
      transition:border-color .12s ease, background .12s ease, box-shadow .12s ease;
    }
    .book:hover {
      border-color:var(--primary); background:#F5FBFF;
      box-shadow:0 1px 4px rgba(15,42,71,.08);
    }
    .book-main { min-width:0; flex:1; }
    .book-name { font-size:16px; font-weight:600; color:var(--navy); line-height:1.4; }
    .book-meta { font-size:14px; color:var(--muted); margin-top:2px; line-height:1.4; }
    .book-side {
      display:flex; align-items:center; gap:10px; flex-shrink:0;
    }
    .chip {
      display:inline-block; border-radius:8px; padding:5px 12px;
      font-size:14px; font-weight:600; background:var(--chip); color:var(--navy); white-space:nowrap;
    }
    .chip.warn { background:var(--warn-bg); color:var(--warn-fg); }
    .chip.good { background:var(--good-bg); color:var(--good-fg); }
    .loading { color:var(--muted); padding:8px 0; }
    .error {
      color:#C0392B; background:#FDECEC; border-radius:10px; padding:12px 14px;
    }
    .hidden { display:none !important; }
    @media (max-width:520px) {
      :root { --card-pad:20px; --guide-h:64px; --cta-w:100%; }
      h1 { font-size:24px; }
      h2 { font-size:18px; }
      .bot { width:56px; height:56px; }
      .card-actions { justify-content:stretch; }
      a.btn-primary, a.btn-admin {
        width:100%; max-width:none; min-width:0;
      }
      .book { flex-wrap:wrap; }
      .book-side { width:100%; justify-content:space-between; }
    }
    @media (prefers-reduced-motion:reduce) {
      .book, .pick { transition:none; }
    }
  </style>
</head>
<body>
  <header class="appHead">
    <h1>年度予算策定</h1>
  </header>

  <div id="error" class="error hidden" role="alert"></div>
  <div id="loading" class="loading">画面を読み込んでいます…</div>

  <div id="app" class="hidden">
    <section id="createCard" class="card primary-card" aria-labelledby="createTitle">
      <header class="card-head">
        <span class="layer-label">新規</span>
        <h2 id="createTitle">新しい予測シート</h2>
      </header>
      <div class="cast">
        <span class="bot-slot"><span id="createBot" class="bot" aria-hidden="true"></span></span>
        <div class="bubble">
          <p id="createBubble">新しく始めるなら、このボタンです。</p>
        </div>
      </div>
      <div class="card-body"></div>
      <div class="card-actions">
        <a id="createButton" class="btn btn-primary" href="#" target="_blank" rel="noopener">新しい予測シートを作る</a>
      </div>
    </section>

    <section id="existingCard" class="card" aria-labelledby="existingTitle">
      <header class="card-head">
        <span class="layer-label">既存</span>
        <h2 id="existingTitle">作成済みシート</h2>
      </header>
      <div class="cast">
        <span class="bot-slot"><span id="existingBot" class="bot" aria-hidden="true"></span></span>
        <div class="bubble">
          <p id="existingBubble">年度を選ぶと、用意済みのクライアントが並ぶよ。</p>
        </div>
      </div>
      <div class="card-body">
        <div id="years" class="picks" role="group" aria-label="年度"></div>
        <div id="books" class="books" aria-live="polite"></div>
      </div>
      <div class="card-actions"></div>
    </section>

    <section id="adminCard" class="card hidden" aria-labelledby="adminTitle">
      <header class="card-head">
        <span class="layer-label">管理</span>
        <h2 id="adminTitle">管理ハブ</h2>
      </header>
      <div class="cast">
        <span class="bot-slot"><span id="adminBot" class="bot" aria-hidden="true"></span></span>
        <div class="bubble">
          <p id="adminBubble">整備はここから。</p>
        </div>
      </div>
      <div class="card-body"></div>
      <div class="card-actions">
        <a id="adminButton" class="btn btn-admin" href="#" target="_blank" rel="noopener">管理ハブを開く</a>
      </div>
    </section>
  </div>

  <script>
    var CREATE_CHAR_ID = 'yajirushi';
    var EXISTING_CHAR_ID = 'kurippu';
    var ADMIN_CHAR_ID = 'haguruma';
    var EXISTING_DEFAULT_TALK = '年度を選ぶと、用意済みのクライアントが並ぶよ。';
    var EXISTING_EMPTY_ALL_TALK = 'まだ作成済みのシートはないみたい。新規から始めよう。';
    var EXISTING_EMPTY_YEAR_TALK = 'この年度には、まだ用意済みのシートがないよ。';
    var entryModel = null;
    var selectedYear = 0;
    var existingTalkOverride = '';
    function chipClass(tone) {
      if (tone === 'warn') return 'chip warn';
      if (tone === 'good') return 'chip good';
      return 'chip';
    }
    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function userFacing(value) {
      return String(value == null ? '' : value)
        .replace(/専用ブック/g, 'クライアント年度ブック')
        .replace(/ブック/g, 'クライアント年度ブック');
    }
    function booksForYear(year) {
      return (entryModel.books || []).filter(function (book) {
        return Number(book.fiscalYear) === Number(year);
      });
    }
    function paintCharacter(botId, bubbleId, charId, fallbackTalk) {
      var bot = document.getElementById(botId);
      var bubble = document.getElementById(bubbleId);
      if (typeof characterSvg === 'function') {
        bot.innerHTML = characterSvg(charId, 'happy') || characterSvg(charId) || '';
      }
      var line = '';
      if (typeof characterTalk === 'function') {
        line = characterTalk(charId, 'hello') || characterLine(charId) || '';
      } else if (typeof characterLine === 'function') {
        line = characterLine(charId) || '';
      }
      bubble.textContent = line || fallbackTalk;
    }
    function paintExistingBubble() {
      var bubble = document.getElementById('existingBubble');
      if (!bubble) return;
      if (existingTalkOverride) {
        bubble.textContent = existingTalkOverride;
        return;
      }
      var line = '';
      if (typeof characterTalk === 'function') {
        line = characterTalk(EXISTING_CHAR_ID, 'hello') || characterLine(EXISTING_CHAR_ID) || '';
      } else if (typeof characterLine === 'function') {
        line = characterLine(EXISTING_CHAR_ID) || '';
      }
      bubble.textContent = line || EXISTING_DEFAULT_TALK;
    }
    function paintYears() {
      var years = entryModel.years || [];
      var box = document.getElementById('years');
      if (!years.length) {
        box.innerHTML = '';
        return;
      }
      box.innerHTML = years.map(function (year) {
        var pressed = Number(year) === Number(selectedYear) ? 'true' : 'false';
        var selected = pressed === 'true' ? ' selected' : '';
        return '<button type="button" class="pick' + selected + '" data-year="' + year +
          '" aria-pressed="' + pressed + '">' + year + '年度</button>';
      }).join('');
      Array.prototype.forEach.call(box.querySelectorAll('[data-year]'), function (button) {
        button.addEventListener('click', function () {
          selectedYear = Number(button.getAttribute('data-year'));
          try { sessionStorage.setItem('vnext-entry-year', String(selectedYear)); } catch (ignored) {}
          paintYears();
          paintBooks();
        });
      });
    }
    function paintBooks() {
      var box = document.getElementById('books');
      var allBooks = entryModel.books || [];
      existingTalkOverride = '';
      if (!allBooks.length) {
        box.innerHTML = '';
        existingTalkOverride = EXISTING_EMPTY_ALL_TALK;
        paintExistingBubble();
        return;
      }
      var rows = selectedYear ? booksForYear(selectedYear) : allBooks;
      if (!rows.length) {
        box.innerHTML = '';
        existingTalkOverride = EXISTING_EMPTY_YEAR_TALK;
        paintExistingBubble();
        return;
      }
      paintExistingBubble();
      box.innerHTML = rows.map(function (book) {
        var yearLabel = escapeHtml(book.fiscalYear) + '年度';
        var meta = book.nextAction
          ? escapeHtml(userFacing(book.nextAction))
          : yearLabel;
        var body =
          '<div class="book-main"><div class="book-name">' + escapeHtml(book.clientName) + '</div>' +
          '<div class="book-meta">' + yearLabel + (book.nextAction ? ' · ' + meta : '') + '</div></div>' +
          '<div class="book-side"><span class="' + chipClass(book.tone) + '">' +
          escapeHtml(userFacing(book.stateLabel)) + '</span>';
        if (book.url) {
          body += '<a class="btn-open" href="' + escapeHtml(book.url) +
            '" target="_blank" rel="noopener">開く</a>';
        }
        body += '</div>';
        return '<div class="book">' + body + '</div>';
      }).join('');
    }
    function paintCreateCta(model) {
      var createButton = document.getElementById('createButton');
      if (model.portalUrl) {
        createButton.href = model.portalUrl;
        createButton.setAttribute('target', '_blank');
        createButton.setAttribute('rel', 'noopener');
        createButton.removeAttribute('aria-disabled');
      } else {
        createButton.href = '#';
        createButton.removeAttribute('target');
        createButton.removeAttribute('rel');
        createButton.setAttribute('aria-disabled', 'true');
      }
    }
    function paintAdmin(model) {
      var adminCard = document.getElementById('adminCard');
      var adminButton = document.getElementById('adminButton');
      if (model.adminHubUrl) {
        adminButton.href = model.adminHubUrl;
        adminCard.classList.remove('hidden');
        paintCharacter('adminBot', 'adminBubble', ADMIN_CHAR_ID, '整備はここから。');
      } else {
        adminButton.href = '#';
        adminCard.classList.add('hidden');
      }
    }
    function render(model) {
      entryModel = model || { books: [], years: [] };
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      paintCharacter('createBot', 'createBubble', CREATE_CHAR_ID, '新しく始めるなら、このボタンです。');
      paintCharacter('existingBot', 'existingBubble', EXISTING_CHAR_ID, EXISTING_DEFAULT_TALK);
      paintCreateCta(entryModel);
      paintAdmin(entryModel);
      var years = entryModel.years || [];
      var remembered = 0;
      try { remembered = Number(sessionStorage.getItem('vnext-entry-year') || 0); } catch (ignored) {}
      selectedYear = 0;
      years.forEach(function (year) {
        if (!selectedYear && Number(year) === remembered) selectedYear = Number(year);
      });
      if (!selectedYear && years.length) selectedYear = Number(years[0]);
      paintYears();
      paintBooks();
    }
    function fail(message) {
      document.getElementById('loading').classList.add('hidden');
      var el = document.getElementById('error');
      el.textContent = message;
      el.classList.remove('hidden');
    }
    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(function (error) {
        fail(error && error.message ? error.message : '入口を表示できませんでした。社内アカウントで開き直してください。');
      })
      .vNextPortalGetEntryModel();
  </script>
</body>
</html>
